<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مولد باترونات الخياطة - Lilinora Atelier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .workspace {
            display: flex;
            justify-content: center;
            border: 1px solid #ddd;
            background-color: #fff;
            min-height: 600px;
            position: relative;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: 650px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>نظام توليد الباترونات - Lilinora Atelier</h1>
    <div class="controls">
        <button onclick="drawBodiceBlock()">رسم باترون الصدر (UK 12)</button>
        <button onclick="drawSleeveBlock()">رسم باترون الكم</button>
        <button onclick="drawSkirtBlock()">رسم باترون التنورة</button>
    </div>
    
    <div class="workspace">
        <svg id="patternCanvas" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
            <!-- شبكة الإحداثيات الخلفية -->
            <defs>
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e5e5" stroke-width="1"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
            
            <!-- مجموعة العناصر الرسومية -->
            <g id="patternGroup" transform="translate(100, 50)">
                <!-- العناصر الافتراضية تظهر هنا -->
                <text x="200" y="250" fill="#888" font-size="18" text-anchor="middle">اختر نوع الباترون من الأعلى للبدء بالعرض</text>
            </g>
        </svg>
    </div>
</div>

<script>
    function clearCanvas() {
        document.getElementById('patternGroup').innerHTML = '';
    }

    function drawBodiceBlock() {
        clearCanvas();
        const group = document.getElementById('patternGroup');
        
        // رسم خطوط باترون الصدر الأساسي (مثال توضيحي هندسي)
        let bodiceHTML = `
            <!-- خطوط الأساس -->
            <rect x="50" y="50" width="250" height="350" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,5"/>
            <!-- محيط الباترون الأمامي/الخلفي المبسط -->
            <path d="M 50 50 C 50 20, 150 20, 200 50 L 250 150 L 300 400 L 50 400 Z" fill="rgba(0, 123, 255, 0.05)" stroke="#007bff" stroke-width="2"/>
            <!-- خطوط البنسات والرقبة -->
            <path d="M 120 50 L 120 180" stroke="#ff4d4d" stroke-width="1"/>
            <text x="100" y="30" fill="#333" font-size="14">مقاس UK 12 - باترون الصدر (Bodice Block)</text>
        `;
        group.innerHTML = bodiceHTML;
    }

    function drawSleeveBlock() {
        clearCanvas();
        const group = document.getElementById('patternGroup');
        
        let sleeveHTML = `
            <!-- باترون الكم -->
            <path d="M 150 50 Q 220 20, 280 150 L 250 450 L 100 450 Q 100 250, 150 50 Z" fill="rgba(40, 167, 69, 0.05)" stroke="#28a745" stroke-width="2"/>
            <text x="100" y="30" fill="#333" font-size="14">باترون الكم المجهز (Fitted Sleeve)</text>
        `;
        group.innerHTML = sleeveHTML;
    }

    function drawSkirtBlock() {
        clearCanvas();
        const group = document.getElementById('patternGroup');
        
        let skirtHTML = `
            <!-- باترون التنورة -->
            <path d="M 100 50 L 300 50 L 350 400 L 50 400 Z" fill="rgba(255, 193, 7, 0.05)" stroke="#ffc107" stroke-width="2"/>
            <text x="100" y="30" fill="#333" font-size="14">باترون التنورة الأساسي (Skirt Block)</text>
        `;
        group.innerHTML = skirtHTML;
    }
</script>

</body>
</html>
