<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilinora Precision Atelier Pattern Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333333;
            --accent-color: #d4af37; /* Atelier Gold */
            --accent-hover: #f3c653;
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --grid-line: #2a2a2a;
            --grid-subline: #1a1a1a;
            --pattern-stroke: #d4af37;
            --pattern-fill: rgba(212, 175, 55, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Control Panel */
        sidebar {
            width: 340px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .brand-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-header h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
            font-weight: 600;
        }

        .brand-header p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .controls-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group input, .control-group select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .control-group input:focus, .control-group select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .action-buttons {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #121212;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-color);
        }

        /* Main Workspace */
        main {
            flex: 1;
            position: relative;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg#patternCanvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        svg#patternCanvas:active {
            cursor: grabbing;
        }

        .status-bar {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
            backdrop-filter: blur(5px);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar Control Panel -->
    <sidebar>
        <div class="brand-header">
            <h1>Lilinora Atelier</h1>
            <p>Precision Parametric Pattern Engine</p>
        </div>
        
        <div class="controls-container">
            <div class="control-group">
                <label for="patternType">Pattern Block</label>
                <select id="patternType" onchange="generatePattern()">
                    <option value="bodice_front">Bodice Front (UK Size 12)</option>
                    <option value="bodice_back">Bodice Back (UK Size 12)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="bust">Bust Circumference (cm)</label>
                <input type="number" id="bust" value="88" step="0.5" oninput="generatePattern()">
            </div>

            <div class="control-group">
                <label for="waist">Waist Circumference (cm)</label>
                <input type="number" id="waist" value="70" step="0.5" oninput="generatePattern()">
            </div>

            <div class="control-group">
                <label for="backLength">Back Waist Length (cm)</label>
                <input type="number" id="backLength" value="40" step="0.5" oninput="generatePattern()">
            </div>

            <div class="control-group">
                <label for="ease">Ease Allowance (cm)</label>
                <input type="number" id="ease" value="4" step="0.5" oninput="generatePattern()">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-secondary" onclick="resetView()">Reset View</button>
            <button class="btn btn-primary" onclick="exportSVG()">Export SVG</button>
        </div>
    </sidebar>

    <!-- Main Workspace Canvas -->
    <main>
        <svg id="patternCanvas">
            <defs>
                <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
                    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="var(--grid-line)" stroke-width="1"/>
                </pattern>
                <pattern id="subGridPattern" width="10" height="10" patternUnits="userSpaceOnUse">
                    <path d="M 10 0 L 0 0 0 10" fill="none" stroke="var(--grid-subline)" stroke-width="0.5"/>
                </pattern>
            </defs>

            <!-- Background Grid Rect -->
            <rect id="gridBg" width="100%" height="100%" fill="url(#subGridPattern)" />
            
            <!-- Main Pattern Group with Pan/Zoom Transformations -->
            <g id="viewport">
                <g id="gridLayer"></g>
                <g id="patternLayer"></g>
            </g>
        </svg>

        <div class="status-bar" id="statusBar">Zoom: 100% | Scale: 1px = 1mm</div>
    </main>

    <script>
        // Workspace State & Pan/Zoom Variables
        let panX = 200;
        let panY = 100;
        let scale = 1.5;
        let isDragging = false;
        let startX, startY;

        const svgCanvas = document.getElementById('patternCanvas');
        const viewport = document.getElementById('viewport');
        const statusBar = document.getElementById('statusBar');

        // Initialize Grid and Render Engine
        function initGrid() {
            const gridLayer = document.getElementById('gridLayer');
            gridLayer.innerHTML = '';

            // Draw major reference axes (X and Y origin lines)
            const axisX = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            axisX.setAttribute('x1', -2000);
            axisX.setAttribute('y1', 0);
            axisX.setAttribute('x2', 2000);
            axisX.setAttribute('y2', 0);
            axisX.setAttribute('stroke', '#444');
            axisX.setAttribute('stroke-width', '1');
            gridLayer.appendChild(axisX);

            const axisY = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            axisY.setAttribute('x1', 0);
            axisY.setAttribute('y1', -2000);
            axisY.setAttribute('x2', 0);
            axisY.setAttribute('y2', 2000);
            axisY.setAttribute('stroke', '#444');
            axisY.setAttribute('stroke-width', '1');
            gridLayer.appendChild(axisY);

            updateTransform();
            generatePattern();
        }

        function updateTransform() {
            viewport.setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
            statusBar.innerText = `Zoom: ${Math.round(scale * 100)}% | Origin: (${panX}, ${panY})`;
        }

        // Parametric Pattern Generator Logic
        function generatePattern() {
            const patternLayer = document.getElementById('patternLayer');
            patternLayer.innerHTML = '';

            const bust = parseFloat(document.getElementById('bust').value) || 88;
            const waist = parseFloat(document.getElementById('waist').value) || 70;
            const backLength = parseFloat(document.getElementById('backLength').value) || 40;
            const type = document.getElementById('patternType').value;

            // Conversion scale factor: 1 cm = 10 pixels for precise drafting view
            const s = 10; 

            // Basic parametric coordinate calculations for Bodice Block
            const chestWidth = (bust / 4) * s;
            const waistWidth = (waist / 4) * s;
            const lengthPx = backLength * s;

            let pathData = "";

            if (type === 'bodice_front') {
                // Parametric Bodice Front Draft Path
                pathData = `
                    M 0 0
                    L ${chestWidth + 20} 0
                    C ${chestWidth + 20} ${lengthPx * 0.3}, ${chestWidth} ${lengthPx * 0.5}, ${chestWidth} ${lengthPx * 0.6}
                    L ${waistWidth + 15} ${lengthPx}
                    L 15 ${lengthPx}
                    C 10 ${lengthPx * 0.6}, 0 ${lengthPx * 0.3}, 0 0
                    Z
                `;
            } else {
                // Parametric Bodice Back Draft Path
                pathData = `
                    M 0 0
                    L ${chestWidth} 0
                    C ${chestWidth} ${lengthPx * 0.3}, ${chestWidth - 5} ${lengthPx * 0.5}, ${chestWidth - 5} ${lengthPx * 0.6}
                    L ${waistWidth} ${lengthPx}
                    L 0 ${lengthPx}
                    Z
                `;
            }

            // Render Pattern Outline SVG Element
            const patternPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            patternPath.setAttribute('d', pathData);
            patternPath.setAttribute('fill', 'var(--pattern-fill)');
            patternPath.setAttribute('stroke', 'var(--pattern-stroke)');
            patternPath.setAttribute('stroke-width', '2');
            patternPath.setAttribute('stroke-dasharray', 'none');
            patternLayer.appendChild(patternPath);

            // Add grainline arrow & text markers
            const grainline = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            grainline.setAttribute('x1', chestWidth / 2);
            grainline.setAttribute('y1', 20);
            grainline.setAttribute('x2', chestWidth / 2);
            grainline.setAttribute('y2', lengthPx - 20);
            grainline.setAttribute('stroke', 'var(--accent-color)');
            grainline.setAttribute('stroke-width', '1');
            grainline.setAttribute('stroke-dasharray', '5,5');
            patternLayer.appendChild(grainline);

            // Add CB marker point: 1 inch from top and 1 inch from right
            const inchToPx = 2.54 * s; // 1 inch converted to pixels at current scale
            const markerX = chestWidth - inchToPx;
            const markerY = inchToPx;

            const cbCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            cbCircle.setAttribute('cx', markerX);
            cbCircle.setAttribute('cy', markerY);
            cbCircle.setAttribute('r', '4');
            cbCircle.setAttribute('fill', '#0066ff');
            cbCircle.setAttribute('stroke', '#ffffff');
            cbCircle.setAttribute('stroke-width', '1.5');
            patternLayer.appendChild(cbCircle);

            const cbText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            cbText.setAttribute('x', markerX + 8);
            cbText.setAttribute('y', markerY + 4);
            cbText.setAttribute('fill', '#0066ff');
            cbText.setAttribute('font-size', '12');
            cbText.setAttribute('font-weight', 'bold');
            cbText.textContent = 'CB';
            patternLayer.appendChild(cbText);
        }

        // Pan and Zoom Event Listeners
        svgCanvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        svgCanvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            if (e.deltaY < 0) {
                scale *= (1 + zoomIntensity);
            } else {
                scale /= (1 + zoomIntensity);
            }
            scale = Math.max(0.2, Math.min(5, scale));
            updateTransform();
        }, { passive: false });

        function resetView() {
            panX = 200;
            panY = 100;
            scale = 1.5;
            updateTransform();
        }

        function exportSVG() {
            const svgContent = svgCanvas.outerHTML;
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'lilinora_pattern_block.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Initial execution on window load
        window.onload = initGrid;
    </script>
</body>
</html>
