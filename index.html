<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodice Pattern Generator - Technical Block</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; background: #f4f6f8; }
    h1 { margin-bottom: 20px; font-size: 20px; color: #1a1a1a; }

    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #444; }
    input[type="number"], select { width: 100%; padding: 7px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .checkbox-group label { margin-bottom: 0; cursor: pointer; }
    .checkbox-group input { width: auto; cursor: pointer; }
    .btn-container { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #0275d8; color: #fff; }
    .btn-primary:hover { background: #025aa5; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-secondary:hover { background: #5a6268; }
    .viewer { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: auto; min-height: 650px; display: flex; justify-content: center; }
  </style>
</head>
<body>

  <h1>Bodice Pattern Generator (Technical Woven Block)</h1>
  
  <div class="container">
    <div class="controls">
      <h3>Measurements (Inches)</h3>
      <div class="form-group">
        <label for="bust">Bust</label>
        <input type="number" id="bust" value="38.5" step="0.25">
      </div>
      <div class="form-group">
        <label for="waist">Waist</label>
        <input type="number" id="waist" value="28.75" step="0.25">
      </div>
      <div class="form-group">
        <label for="hip">Hip</label>
        <input type="number" id="hip" value="42" step="0.25">
      </div>
      <div class="form-group">
        <label for="backWidth">Across Back Width</label>
        <input type="number" id="backWidth" value="14.0" step="0.25">
      </div>
      <div class="form-group">
        <label for="chestWidth">Across Chest Width</label>
        <input type="number" id="chestWidth" value="13.5" step="0.25">
      </div>
      <div class="form-group">
        <label for="shoulderLength">Shoulder Length</label>
        <input type="number" id="shoulderLength" value="6.25" step="0.25">
      </div>
      <div class="form-group">
        <label for="backNeckToWaist">Back Neck to Waist</label>
        <input type="number" id="backNeckToWaist" value="18.5" step="0.25">
      </div>
      <div class="form-group">
        <label for="waistToHip">Waist to Hip</label>
        <input type="number" id="waistToHip" value="9.0" step="0.25">
      </div>

      <h3>Drafting Options</h3>
      <div class="form-group">
        <label for="easeProfile">Block Type &amp; Ease Allowance</label>
        <select id="easeProfile">
          <option value="corset">Corset / Foundation Block (Bust: 0", Waist: -1.0", Hip: 0")</option>
          <option value="close">Close-Fitting Bodice Block (Bust: +1.5", Waist: +1.0", Hip: +1.5")</option>
          <option value="standard" selected>Standard Bodice Block (Bust: +2.0", Waist: +1.5", Hip: +2.0")</option>
          <option value="loose">Loose-Fitting / Outerwear Block (Bust: +4.0", Waist: +2.5", Hip: +3.0")</option>
        </select>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="showGrid" checked>
        <label for="showGrid">Show Construction Grid &amp; Labels</label>
      </div>

      <div class="btn-container">
        <button class="btn-primary" id="generateBtn" type="button">Generate Pattern</button>
        <button class="btn-secondary" id="downloadBtn" type="button">Download SVG Pattern</button>
      </div>
    </div>

    <div class="viewer" id="svgContainer"></div>
  </div>

  <script>
    const EASE_PROFILES = {
      corset:   { bust: 0.0, waist: -1.0, hip: 0.0 },
      close:    { bust: 1.5, waist: 1.0, hip: 1.5 },
      standard: { bust: 2.0, waist: 1.5, hip: 2.0 },
      loose:    { bust: 4.0, waist: 2.5, hip: 3.0 }
    };

    // Helper: Calculate exact arc length of a cubic Bézier curve segment
    function getBezierLength(p0, c1, c2, p3, steps = 100) {
      let length = 0;
      let prev = p0;
      for (let i = 1; i <= steps; i++) {
        let t = i / steps;
        let nt = 1 - t;
        let x = nt*nt*nt*p0.x + 3*nt*nt*t*c1.x + 3*nt*t*t*c2.x + t*t*t*p3.x;
        let y = nt*nt*nt*p0.y + 3*nt*nt*t*c1.y + 3*nt*t*t*c2.y + t*t*t*p3.y;
        let curr = { x, y };
        length += Math.hypot(curr.x - prev.x, curr.y - prev.y);
        prev = curr;
      }
      return length;
    }

    // Helper: Match curve lengths by iteratively adjusting control point weights
    function balanceCurveLengths(p0, c1_a, c2_a, p3, c1_b, c2_b, targetLen) {
      let scale = 1.0;
      let bestC1 = { ...c1_b };
      let bestC2 = { ...c2_b };
      
      for (let iter = 0; iter < 10; iter++) {
        let currentLen = getBezierLength(p0, bestC1, bestC2, p3);
        if (Math.abs(currentLen - targetLen) < 0.001) break;
        let ratio = targetLen / (currentLen || 1);
        scale *= Math.sqrt(ratio);
        
        bestC1.x = p0.x + (c1_b.x - p0.x) * scale;
        bestC1.y = p0.y + (c1_b.y - p0.y) * scale;
        bestC2.x = p3.x + (c2_b.x - p3.x) * scale;
        bestC2.y = p3.y + (c2_b.y - p3.y) * scale;
      }
      return { c1: bestC1, c2: bestC2 };
    }

    // Helper: Calculate distance between two points
    function dist(p1, p2) {
      return Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2);
    }

    function calculateBodice(m, profileKey, showGrid) {
      const ease = EASE_PROFILES[profileKey] || EASE_PROFILES.standard;

      const easeBust = m.bust + ease.bust;
      const easeWaist = m.waist + ease.waist;
      const easeHip = m.hip + ease.hip;

      const backBustW = easeBust / 4 - 0.25;
      const frontBustW = easeBust / 4 + 0.25;

      const backHipW = easeHip / 4 - 0.25;
      const frontHipW = easeHip / 4 + 0.25;

      const blockGap = 3.0;
      const totalWidth = backBustW + frontBustW + blockGap;
      const totalHeight = m.backNeckToWaist + m.waistToHip;

      const topY = 0.5; 
      const bustY = topY + m.backNeckToWaist * 0.5;
      const trueBustY = bustY + 1.0;
      const waistY = topY + m.backNeckToWaist;
      const hipY = topY + totalHeight;

      const neckW = (m.bust / 8 + 1.25) / 2;

      const totalBustWidth = backBustW + frontBustW;
      const totalWaistWidthNeeded = easeWaist / 2;
      const totalWaistIntake = Math.max(0, totalBustWidth - totalWaistWidthNeeded);

      const maxSideSeamIntake = totalWaistIntake * 0.35;
      const remainingIntake = totalWaistIntake - maxSideSeamIntake;

      const sideWaistIntakeEach = maxSideSeamIntake / 2;
      const b_waistDartW = remainingIntake * 0.4;
      const f_waistDartW = remainingIntake * 0.6;

      // --- BACK POINTS ---
      const b_np = { x: neckW, y: topY };
      const b_shoulderDrop = topY + 1.25;
      const totalBackShWidth = m.shoulderLength + 0.5;
      const b_spTotalEnd = { x: neckW + totalBackShWidth, y: b_shoulderDrop };

      // Shoulder Mid Point & Apex positioning (per instructions)
      const b_shoulderMid = {
        x: (b_np.x + b_spTotalEnd.x) / 2,
        y: (b_np.y + b_spTotalEnd.y) / 2
      };
      const b_shDartApex = { x: b_shoulderMid.x - 0.375, y: b_shoulderMid.y + 2.5 };

      // --- DART TRUING LOGIC (Ensuring equal leg lengths) ---
      const b_dartW = 0.5;
      const raw_b_shDartInner = { x: b_shoulderMid.x - (b_dartW / 2), y: b_shoulderMid.y };
      const raw_b_shDartOuter = { x: b_shoulderMid.x + (b_dartW / 2), y: b_shoulderMid.y };

      const len1 = dist(raw_b_shDartInner, b_shDartApex);
      const len2 = dist(raw_b_shDartOuter, b_shDartApex);
      
      let final_b_shDartInner, final_b_shDartOuter;
      // Calculate the angle of the shoulder line to adjust points along it
      const shoulderAngle = Math.atan2(b_spTotalEnd.y - b_np.y, b_spTotalEnd.x - b_np.x);

      if (len2 > len1) {
        const targetLen = len2; // Outer leg is longer, so use its length
        const dx = Math.cos(shoulderAngle) * targetLen;
        const dy = Math.sin(shoulderAngle) * targetLen;
        // Recalculate inner point position to maintain length
        final_b_shDartInner = { x: b_shDartApex.x + dx, y: b_shDartApex.y + dy };
        final_b_shDartOuter = raw_b_shDartOuter;
      } else {
        const targetLen = len1; // Inner leg is longer (less likely)
        const dx = Math.cos(shoulderAngle + Math.PI) * targetLen;
        const dy = Math.sin(shoulderAngle + Math.PI) * targetLen;
        // Recalculate outer point position to maintain length
        final_b_shDartOuter = { x: b_shDartApex.x + dx, y: b_shDartApex.y + dy };
        final_b_shDartInner = raw_b_shDartInner;
      }
      // --- END DART TRUING ---

      const b_waistDartX = backBustW * 0.45;
      const b_waistDartTop = { x: b_waistDartX, y: bustY + 0.5 };
      const b_waistDartBottom = { x: b_waistDartX, y: waistY + (m.waistToHip * 0.6) };

      // --- FRONT POINTS ---
      const f_cfX = totalWidth;
      const f_np = { x: f_cfX - neckW, y: topY };
      const totalFrontShWidth = m.shoulderLength + 1.0;
      const f_spTotalEnd = { x: f_cfX - neckW - totalFrontShWidth, y: b_shoulderDrop + 0.2 };

      const f_apex = { x: f_cfX - (m.bust / 10 + 0.75), y: trueBustY };

      const f_dartW = 1.0;
      const f_halfSh = totalFrontShWidth / 2;
      const f_shDartInner = { x: f_cfX - neckW - f_halfSh + (f_dartW / 2), y: topY + 0.3 };
      const f_shDartOuter = { x: f_cfX - neck
