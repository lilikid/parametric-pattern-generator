<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodice Pattern Generator - Technical Block</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; background: #f4f6f8; }
    h1 { margin-bottom: 20px; font-size: 20px; color: #1a1a1a; }
    .container { display: flex; gap: 20px; align-items: flex-start; }
    .controls { width: 340px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .controls h3 { margin-top: 0; margin-bottom: 12px; font-size: 14px; border-bottom: 2px solid #eee; padding-bottom: 6px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #444; }
    input[type="number"], select { width: 100%; padding: 7px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .checkbox-group label { margin-bottom: 0; cursor: pointer; }
    .checkbox-group input { width: auto; cursor: pointer; }
    .btn-container { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #0275d8; color: #fff; }
    .btn-primary:hover { background: #025aa5; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-secondary:hover { background: #5a6268; }
    .viewer { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: auto; min-height: 650px; display: flex; justify-content: center; }
  </style>
</head>
<body>
  <h1>Bodice Pattern Generator (Technical Woven Block)</h1>
  <div class="container">
    <div class="controls">
      <h3>Measurements (Inches)</h3>
      <div class="form-group"><label>Bust</label><input type="number" id="bust" value="38.5" step="0.25"></div>
      <div class="form-group"><label>Waist</label><input type="number" id="waist" value="28.75" step="0.25"></div>
      <div class="form-group"><label>Hip</label><input type="number" id="hip" value="42" step="0.25"></div>
      <div class="form-group"><label>Across Back Width</label><input type="number" id="backWidth" value="14.0" step="0.25"></div>
      <div class="form-group"><label>Across Chest Width</label><input type="number" id="chestWidth" value="13.5" step="0.25"></div>
      <div class="form-group"><label>Shoulder Length</label><input type="number" id="shoulderLength" value="6.25" step="0.25"></div>
      <div class="form-group"><label>Back Neck to Waist</label><input type="number" id="backNeckToWaist" value="18.5" step="0.25"></div>
      <div class="form-group"><label>Waist to Hip</label><input type="number" id="waistToHip" value="9.0" step="0.25"></div>

      <h3>Drafting Options</h3>
      <div class="form-group">
        <label>Block Type &amp; Ease Allowance</label>
        <select id="easeProfile">
          <option value="corset">Corset / Foundation Block (Bust: 0", Waist: -1.0")</option>
          <option value="close">Close-Fitting Bodice Block (Bust: +1.5", Waist: +1.0")</option>
          <option value="standard" selected>Standard Bodice Block (Bust: +2.0", Waist: +1.5")</option>
          <option value="loose">Loose-Fitting / Outerwear Block (Bust: +4.0", Waist: +2.5")</option>
        </select>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="showGrid" checked>
        <label for="showGrid">Show Construction Grid &amp; Labels</label>
      </div>
      <div class="btn-container">
        <button class="btn-primary" id="generateBtn" type="button">Generate Pattern</button>
        <button class="btn-secondary" id="downloadBtn" type="button">Download SVG Pattern</button>
      </div>
    </div>
    <div class="viewer" id="svgContainer"></div>
  </div>

  <script>
    const EASE_PROFILES = {
      corset:   { bust: 0.0, waist: -1.0, hip: 0.0 },
      close:    { bust: 1.5, waist: 1.0, hip: 1.5 },
      standard: { bust: 2.0, waist: 1.5, hip: 2.0 },
      loose:    { bust: 4.0, waist: 2.5, hip: 3.0 }
    };

    function dist(p1, p2) {
      return Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2);
    }

    function calculateBodice(m, profileKey, showGrid) {
      const ease = EASE_PROFILES[profileKey] || EASE_PROFILES.standard;
      const easeBust = m.bust + ease.bust;
      const easeWaist = m.waist + ease.waist;
      const easeHip = m.hip + ease.hip;

      const backBustW = easeBust / 4 - 0.25;
      const frontBustW = easeBust / 4 + 0.25;
      const backHipW = easeHip / 4 - 0.25;
      const frontHipW = easeHip / 4 + 0.25;

      const blockGap = 3.0;
      const totalWidth = backBustW + frontBustW + blockGap;
      const totalHeight = m.backNeckToWaist + m.waistToHip;

      const topY = 0.5; 
      const bustY = topY + m.backNeckToWaist * 0.5;
      const trueBustY = bustY + 1.0;
      const waistY = topY + m.backNeckToWaist;
      const hipY = topY + totalHeight;

      const neckW = (m.bust / 8 + 1.25) / 2;
      const totalBustWidth = backBustW + frontBustW;
      const totalWaistIntake = Math.max(0, totalBustWidth - (easeWaist / 2));
      const maxSideSeamIntake = totalWaistIntake * 0.35;
      const remainingIntake = totalWaistIntake - maxSideSeamIntake;
      const sideWaistIntakeEach = maxSideSeamIntake / 2;
      const b_waistDartW = remainingIntake * 0.4;
      const f_waistDartW = remainingIntake * 0.6;

      // --- BACK POINTS & DART TRUING ---
      const b_np = { x: neckW, y: topY };
      const b_shoulderDrop = topY + 1.25;
      const totalBackShWidth = m.shoulderLength + 0.5;
      const b_spTotalEnd = { x: neckW + totalBackShWidth, y: b_shoulderDrop };

      const b_shoulderMid = { x: (b_np.x + b_spTotalEnd.x) / 2, y: (b_np.y + b_spTotalEnd.y) / 2 };
      const b_shDartApex = { x: b_shoulderMid.x - 0.375, y: b_shoulderMid.y + 2.5 };

      const b_dartW = 0.5;
      const raw_b_inner = { x: b_shoulderMid.x - (b_dartW / 2), y: b_shoulderMid.y };
      const raw_b_outer = { x: b_shoulderMid.x + (b_dartW / 2), y: b_shoulderMid.y };

      const len1 = dist(raw_b_inner, b_shDartApex);
      const len2 = dist(raw_b_outer, b_shDartApex);
      
      let final_b_inner, final_b_outer;
      const shoulderAngle = Math.atan2(b_spTotalEnd.y - b_np.y, b_spTotalEnd.x - b_np.x);

      if (len2 > len1) {
        const dx = Math.cos(shoulderAngle) * len2;
        const dy = Math.sin(shoulderAngle) * len2;
        final_b_inner = { x: b_shDartApex.x + dx, y: b_shDartApex.y + dy };
        final_b_outer = raw_b_outer;
      } else {
        const dx = Math.cos(shoulderAngle + Math.PI) * len1;
        const dy = Math.sin(shoulderAngle + Math.PI) * len1;
        final_b_outer = { x: b_shDartApex.x + dx, y: b_shDartApex.y + dy };
        final_b_inner = raw_b_inner;
      }

      const b_waistDartX = backBustW * 0.45;
      const b_waistDartTop = { x: b_waistDartX, y: bustY + 0.5 };
      const b_waistDartBottom = { x: b_waistDartX, y: waistY + (m.waistToHip * 0.6) };

      // --- FRONT POINTS ---
      const f_cfX = totalWidth;
      const f_np = { x: f_cfX - neckW, y: topY };
      const totalFrontShWidth = m.shoulderLength + 1.0;
      const f_spTotalEnd = { x: f_cfX - neckW - totalFrontShWidth, y: b_shoulderDrop + 0.2 };
      const f_apex = { x: f_cfX - (m.bust / 10 + 0.75), y: trueBustY };

      const f_dartW = 1.0;
      const f_halfSh = totalFrontShWidth / 2;
      const f_shDartInner = { x: f_cfX - neckW - f_halfSh + (f_dartW / 2), y: topY + 0.3 };
      const f_shDartOuter = { x: f_cfX - neckW - f_halfSh - (f_dartW / 2), y: topY + 0.6 };

      const f_waistDartTop = { x: f_apex.x, y: f_apex.y + 1.0 };
      const f_waistDartBottom = { x: f_apex.x, y: waistY + (m.waistToHip * 0.55) };

      const upX = backBustW + (blockGap / 2);
      const upY = bustY + 0.5;

      return {
        showGrid,
        totalW: totalWidth + 3.0,
        totalH: hipY + 1.0,
        lines: { topY, bustY, trueBustY, waistY, hipY },
        cbX: 0,
        cfX: f_cfX,
        up: { x: upX, y: upY, leftW: backBustW - sideWaistIntakeEach, rightW: backBustW + blockGap + sideWaistIntakeEach },
        hip: { backHipX: backHipW, frontHipX: f_cfX - frontHipW },
        back: {
          np: b_np, sp: b_spTotalEnd,
          shDartInner: final_b_inner, shDartOuter: final_b_outer, shDartApex: b_shDartApex,
          waistDartX: b_waistDartX, waistDartW: b_waistDartW, waistDartTop: b_waistDartTop, waistDartBottom: b_waistDartBottom
        },
        front: {
          np: f_np, sp: f_spTotalEnd, apex: f_apex,
          shDartInner: f_shDartInner, shDartOuter: f_shDartOuter,
          waistDartW: f_waistDartW, waistDartTop: f_waistDartTop, waistDartBottom: f_waistDartBottom
        }
      };
    }

    function renderSVG(d) {
      const scale = 72;
      const wPx = d.totalW * scale;
      const hPx = d.totalH * scale;

      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${wPx} ${hPx}" width="100%" height="100%">`;
      svg += `<defs><style>
        .grid { stroke: #e2e8f0; stroke-width: 0.5; stroke-dasharray: 4 4; }
        .axis-label { font-size: 10px; fill: #718096; font-family: sans-serif; }
        .pattern-line { stroke: #1a202c; stroke-width: 2; fill: none; }
        .construction-line { stroke: #cbd5e0; stroke-width: 1; fill: none; stroke-dasharray: 2 2; }
        .dart-line { stroke: #e53e3e; stroke-width: 1.5; fill: none; }
        .text-label { font-size: 11px; fill: #2d3748; font-family: sans-serif; font-weight: 600; }
      </style></defs>`;

      svg += `<rect width="100%" height="100%" fill="#ffffff" rx="6"/>`;

      if (d.showGrid) {
        svg += `<g id="grid">`;
        for (let x = 0; x <= d.totalW; x += 1) {
          svg += `<line x1="${x*scale}" y1="0" x2="${x*scale}" y2="${hPx}" class="grid" />`;
          svg += `<text x="${x*scale + 2}" y="12" class="axis-label">${x}&quot;</text>`;
        }
        for (let y = 0; y <= d.totalH; y += 1) {
          svg += `<line x1="0" y1="${y*scale}" x2="${wPx}" y2="${y*scale}" class="grid" />`;
          svg += `<text x="4" y="${y*scale - 2}" class="axis-label">${y}&quot;</text>`;
        }
        svg += `</g>`;

        svg += `<g id="construction">`;
        const l = d.lines;
        svg += `<line x1="${d.cbX*scale}" y1="${l.topY*scale}" x2="${d.cfX*scale}" y2="${l.topY*scale}" class="construction-line" />`;
        svg += `<line x1="${d.cbX*scale}" y1="${l.bustY*scale}" x2="${d.cfX*scale}" y2="${l.bustY*scale}" class="construction-line" />`;
        svg += `<line x1="${d.cbX*scale}" y1="${l.waistY*scale}" x2="${d.cfX*scale}" y2="${l.waistY*scale}" class="construction-line" />`;
        svg += `<line x1="${d.cbX*scale}" y1="${l.hipY*scale}" x2="${d.cfX*scale}" y2="${l.hipY*scale}" class="construction-line" />`;
        svg += `</g>`;
      }

      // Back Piece
      svg += `<g id="back-piece">`;
      svg += `<path d="M ${d.cbX*scale} ${d.lines.topY*scale} 
                   L ${d.back.np.x*scale} ${d.back.np.y*scale} 
                   L ${d.back.shDartInner.x*scale} ${d.back.shDartInner.y*scale} 
                   L ${d.back.shDartApex.x*scale} ${d.back.shDartApex.y*scale} 
                   L ${d.back.shDartOuter.x*scale} ${d.back.shDartOuter.y*scale} 
                   L ${d.back.sp.x*scale} ${d.back.sp.y*scale} 
                   Q ${(d.back.sp.x + 0.2)*scale} ${(d.lines.bustY)*scale}, ${d.up.leftW*scale} ${d.lines.bustY*scale} 
                   L ${d.up.leftW*scale} ${d.lines.waistY*scale} 
                   L ${d.hip.backHipX*scale} ${d.lines.hipY*scale} 
                   L ${d.cbX*scale} ${d.lines.hipY*scale} Z" class="pattern-line" />`;
      svg += `<line x1="${d.back.shDartInner.x*scale}" y1="${d.back.shDartInner.y*scale}" x2="${d.back.shDartApex.x*scale}" y2="${d.back.shDartApex.y*scale}" class="dart-line" />`;
      svg += `<line x1="${d.back.shDartOuter.x*scale}" y1="${d.back.shDartOuter.y*scale}" x2="${d.back.shDartApex.x*scale}" y2="${d.back.shDartApex.y*scale}" class="dart-line" />`;
      svg += `<text x="${(d.cbX + 1.5)*scale}" y="${(d.lines.bustY + 1)*scale}" class="text-label">BACK BLOCK</text>`;
      svg += `</g>`;

      // Front Piece
      svg += `<g id="front-piece">`;
      svg += `<path d="M ${d.cfX*scale} ${d.lines.topY*scale} 
                   L ${d.front.np.x*scale} ${d.front.np.y*scale} 
                   L ${d.front.shDartInner.x*scale} ${d.front.shDartInner.y*scale} 
                   L ${d.front.apex.x*scale} ${d.front.apex.y*scale} 
                   L ${d.front.shDartOuter.x*scale} ${d.front.shDartOuter.y*scale} 
                   L ${d.front.sp.x*scale} ${d.front.sp.y*scale} 
                   Q ${(d.front.sp.x - 0.2)*scale} ${(d.lines.bustY)*scale}, ${d.up.rightW*scale} ${d.lines.bustY*scale} 
                   L ${d.up.rightW*scale} ${d.lines.waistY*scale} 
                   L ${d.hip.frontHipX*scale} ${d.lines.hipY*scale} 
                   L ${d.cfX*scale} ${d.lines.hipY*scale} Z" class="pattern-line" />`;
      svg += `<line x1="${d.front.shDartInner.x*scale}" y1="${d.front.shDartInner.y*scale}" x2="${d.front.apex.x*scale}" y2="${d.front.apex.y*scale}" class="dart-line" />`;
      svg += `<line x1="${d.front.shDartOuter.x*scale}" y1="${d.front.shDartOuter.y*scale}" x2="${d.front.apex.x*scale}" y2="${d.front.apex.y*scale}" class="dart-line" />`;
      svg += `<text x="${(d.cfX - 2.5)*scale}" y="${(d.lines.bustY + 1)*scale}" class="text-label">FRONT BLOCK</text>`;
      svg += `</g>`;

      svg += `</svg>`;
      return svg;
    }

    function updatePattern() {
      const m = {
        bust: parseFloat(document.getElementById('bust').value),
        waist: parseFloat(document.getElementById('waist').value),
        hip: parseFloat(document.getElementById('hip').value),
        backWidth: parseFloat(document.getElementById('backWidth').value),
        chestWidth: parseFloat(document.getElementById('chestWidth').value),
        shoulderLength: parseFloat(document.getElementById('shoulderLength').value),
        backNeckToWaist: parseFloat(document.getElementById('backNeckToWaist').value),
        waistToHip: parseFloat(document.getElementById('waistToHip').value)
      };
      const data = calculateBodice(m, document.getElementById('easeProfile').value, document.getElementById('showGrid').checked);
      document.getElementById('svgContainer').innerHTML = renderSVG(data);
    }

    document.getElementById('generateBtn').addEventListener('click', updatePattern);
    document.getElementById('easeProfile').addEventListener('change', updatePattern);
    document.getElementById('showGrid').addEventListener('change', updatePattern);
    
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const blob = new Blob([document.getElementById('svgContainer').innerHTML], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'bodice_technical_block.svg';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    window.onload = updatePattern;
  </script>
</body>
</html>
