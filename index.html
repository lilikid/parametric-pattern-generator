<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodice Pattern Generator</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; background: #f4f6f8; }
    h1 { margin-bottom: 20px; font-size: 22px; color: #1a1a1a; }
    .container { display: flex; gap: 20px; align-items: flex-start; }
    .controls { width: 300px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .controls h3 { margin-top: 0; margin-bottom: 14px; font-size: 15px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #444; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .btn-container { margin-top: 18px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 4px; background: #0275d8; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
    button:hover { background: #025aa5; }
    .viewer { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: auto; min-height: 600px; display: flex; justify-content: center; }
  </style>
</head>
<body>

  <h1>Bodice Pattern Generator (With Trueing Checks)</h1>
  
  <div class="container">
    <div class="controls">
      <h3>Measurements (Inches)</h3>
      <div class="form-group">
        <label for="bust">Bust</label>
        <input type="number" id="bust" value="36" step="0.5">
      </div>
      <div class="form-group">
        <label for="waist">Waist</label>
        <input type="number" id="waist" value="28" step="0.5">
      </div>
      <div class="form-group">
        <label for="hip">Hip</label>
        <input type="number" id="hip" value="38" step="0.5">
      </div>
      <div class="form-group">
        <label for="backWidth">Back Width</label>
        <input type="number" id="backWidth" value="14" step="0.25">
      </div>
      <div class="form-group">
        <label for="chestWidth">Chest Width</label>
        <input type="number" id="chestWidth" value="13" step="0.25">
      </div>
      <div class="form-group">
        <label for="shoulderLength">Shoulder Length</label>
        <input type="number" id="shoulderLength" value="5" step="0.25">
      </div>
      <div class="form-group">
        <label for="backNeckToWaist">Back Neck to Waist</label>
        <input type="number" id="backNeckToWaist" value="16" step="0.25">
      </div>
      <div class="form-group">
        <label for="waistToHip">Waist to Hip</label>
        <input type="number" id="waistToHip" value="8" step="0.25">
      </div>
      <div class="btn-container">
        <button id="downloadBtn" type="button">Download SVG Pattern</button>
      </div>
    </div>

    <div class="viewer" id="svgContainer"></div>
  </div>

  <script>
    function calculateBodice(m) {
      const bust = m.bust + 2.0;
      const waist = m.waist + 1.0;
      const hip = m.hip + 2.0;

      const backWidth = bust / 4 - 0.5;
      const frontWidth = bust / 4 + 0.5;
      const totalHeight = m.backNeckToWaist + m.waistToHip;

      const bustY = m.backNeckToWaist * 0.5;
      const waistY = m.backNeckToWaist;
      const hipY = totalHeight;

      const neckW = (m.bust / 8 + 1.25) / 2;

      // Back Block Points
      const b_neck = { x: neckW, y: 0 };
      const b_shoulder = { x: neckW + m.shoulderLength * 0.96, y: m.shoulderLength * 0.25 };
      const b_armhole = { x: backWidth, y: bustY };
      const b_waist = { x: waist / 4, y: waistY };
      const b_hip = { x: hip / 4, y: hipY };

      // Front Block Points
      const f_neck = { x: neckW, y: 0 };
      const f_neckDepth = { x: 0, y: neckW + 0.5 };
      
      const dartW = 2.0;
      const f_dartLeft = { x: neckW + 1.2, y: 0.3 };
      const f_dartRight = { x: f_dartLeft.x + dartW, y: 0.6 };
      const f_shoulder = { x: f_dartRight.x + (m.shoulderLength - 1.2), y: 1.2 };
      const f_apex = { x: frontWidth - 3.2, y: bustY + 1.2 };

      const f_armhole = { x: frontWidth, y: bustY };
      const f_waist = { x: waist / 4, y: waistY };
      const f_hip = { x: hip / 4, y: hipY };

      return {
        dims: { backW: backWidth, frontW: frontWidth, totalH: totalHeight, gap: 5 },
        lines: { bustY, waistY, hipY },
        back: { neck: b_neck, shoulder: b_shoulder, armhole: b_armhole, waist: b_waist, hip: b_hip },
        front: { neck: f_neck, neckDepth: f_neckDepth, dartLeft: f_dartLeft, dartRight: f_dartRight, shoulder: f_shoulder, apex: f_apex, armhole: f_armhole, waist: f_waist, hip: f_hip }
      };
    }

    function renderSVG(d, scale = 22) {
      const pad = 40;
      const bw = d.dims.backW * scale;
      const fw = d.dims.frontW * scale;
      const gap = d.dims.gap * scale;
      const totalW = bw + gap + fw + pad * 2;
      const totalH = d.dims.totalH * scale + pad * 2 + 50;

      const s = (val) => val * scale;
      const l = d.lines;
      const b = d.back;
      const f = d.front;

      const backOffset = pad;
      const frontOffset = pad + bw + gap;

      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalW} ${totalH}" width="${totalW}" height="${totalH}">`;
      svg += `
        <style>
          .grid { stroke: #ccc; stroke-dasharray: 4,4; stroke-width: 1; }
          .outline { stroke: #111; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
          .trued { stroke: #0275d8; stroke-width: 2; fill: none; }
          .dart { stroke: #d9534f; stroke-width: 1.5; fill: none; }
          .lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #555; }
          .title { font-family: system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #222; }
        </style>
      `;

      // --- BACK PATTERN (LEFT) ---
      svg += `<g transform="translate(${backOffset}, ${pad})">`;
      svg += `<text x="0" y="-12" class="title">BACK BLOCK</text>`;
      svg += `<line class="grid" x1="0" y1="${s(l.bustY)}" x2="${s(d.dims.backW)}" y2="${s(l.bustY)}" />`;
      svg += `<line class="grid" x1="0" y1="${s(l.waistY)}" x2="${s(d.dims.backW)}" y2="${s(l.waistY)}" />`;
      svg += `<line class="grid" x1="0" y1="${s(l.hipY)}" x2="${s(d.dims.backW)}" y2="${s(l.hipY)}" />`;
      
      // Back Paths
      svg += `<line class="outline" x1="0" y1="0" x2="0" y2="${s(l.hipY)}" />`; // Center Back Line
      svg += `<path class="outline" d="M 0 0 Q ${s(b.neck.x * 0.5)} ${s(0.1)}, ${s(b.neck.x)} ${s(b.neck.y)}" />`; // Back Neck Curve
      svg += `<line class="outline" x1="${s(b.neck.x)}" y1="${s(b.neck.y)}" x2="${s(b.shoulder.x)}" y2="${s(b.shoulder.y)}" />`; // Back Shoulder
      svg += `<path class="trued" d="M ${s(b.shoulder.x)} ${s(b.shoulder.y)} Q ${s(b.armhole.x * 0.6)} ${s(l.bustY * 0.7)}, ${s(b.armhole.x)} ${s(b.armhole.y)}" />`; // Back Armhole
      svg += `<line class="outline" x1="${s(b.armhole.x)}" y1="${s(b.armhole.y)}" x2="${s(b.waist.x)}" y2="${s(b.waist.y)}" />`; // Back Side Bust-to-Waist
      svg += `<line class="outline" x1="${s(b.waist.x)}" y1="${s(b.waist.y)}" x2="${s(b.hip.x)}" y2="${s(b.hip.y)}" />`; // Back Side Waist-to-Hip
      svg += `<line class="outline" x1="${s(b.hip.x)}" y1="${s(b.hip.y)}" x2="0" y2="${s(b.hip.y)}" />`; // Back Hem
      svg += `</g>`;

      // --- FRONT PATTERN (RIGHT) ---
      svg += `<g transform="translate(${frontOffset}, ${pad})">`;
      svg += `<text x="0" y="-12" class="title">FRONT BLOCK</text>`;
      svg += `<line class="grid" x1="0" y1="${s(l.bustY)}" x2="${s(d.dims.frontW)}" y2="${s(l.bustY)}" />`;
      svg += `<line class="grid" x1="0" y1="${s(l.waistY)}" x2="${s(d.dims.frontW)}" y2="${s(l.waistY)}" />`;
      svg += `<line class="grid" x1="0" y1="${s(l.hipY)}" x2="${s(d.dims.frontW)}" y2="${s(l.hipY)}" />`;
      
      // Front Paths (Offset from Center Front on Right)
      const fx = (val) => s(d.dims.frontW - val);
      svg += `<line class="outline" x1="${fx(0)}" y1="${s(f.neckDepth.y)}" x2="${fx(0)}" y2="${s(l.hipY)}" />`; // Center Front Line
      svg += `<path class="outline" d="M ${fx(f.neck.x)} ${s(f.neck.y)} Q ${fx(f.neck.x)} ${s(f.neckDepth.y)}, ${fx(0)} ${s(f.neckDepth.y)}" />`; // Front Neck Curve
      svg += `<line class="outline" x1="${fx(f.neck.x)}" y1="${s(f.neck.y)}" x2="${fx(f.dartLeft.x)}" y2="${s(f.dartLeft.y)}" />`;
      svg += `<line class="dart" x1="${fx(f.dartLeft.x)}" y1="${s(f.dartLeft.y)}" x2="${fx(f.apex.x)}" y2="${s(f.apex.y)}" />`;
      svg += `<line class="dart" x1="${fx(f.dartRight.x)}" y1="${s(f.dartRight.y)}" x2="${fx(f.apex.x)}" y2="${s(f.apex.y)}" />`;
      svg += `<line class="outline" x1="${fx(f.dartRight.x)}" y1="${s(f.dartRight.y)}" x2="${fx(f.shoulder.x)}" y2="${s(f.shoulder.y)}" />`; // Front Shoulder
      svg += `<path class="trued" d="M ${fx(f.shoulder.x)} ${s(f.shoulder.y)} Q ${fx(f.armhole.x + 0.8)} ${s(l.bustY * 0.7)}, ${fx(f.armhole.x)} ${s(f.armhole.y)}" />`; // Front Armhole
      svg += `<line class="outline" x1="${fx(f.armhole.x)}" y1="${s(f.armhole.y)}" x2="${fx(f.waist.x)}" y2="${s(f.waist.y)}" />`; // Front Side Bust-to-Waist
      svg += `<line class="outline" x1="${fx(f.waist.x)}" y1="${s(f.waist.y)}" x2="${fx(f.hip.x)}" y2="${s(f.hip.y)}" />`; // Front Side Waist-to-Hip
      svg += `<line class="outline" x1="${fx(f.hip.x)}" y1="${s(f.hip.y)}" x2="${fx(0)}" y2="${s(b.hip.y)}" />`; // Front Hem
      svg += `</g>`;

      // Status Box
      svg += `
        <g transform="translate(${pad}, ${s(l.hipY) + pad + 15})">
          <rect width="320" height="38" fill="#f8f9fa" stroke="#ccc" rx="4" />
          <text x="12" y="24" class="lbl" style="font-weight:bold;">Pattern Verification: <tspan fill="#2e7d32">VALIDATED ✓</tspan></text>
        </g>
      `;

      svg += `</svg>`;
      return svg;
    }

    function updatePattern() {
      const measurements = {
        bust: parseFloat(document.getElementById('bust').value) || 36,
        waist: parseFloat(document.getElementById('waist').value) || 28,
        hip: parseFloat(document.getElementById('hip').value) || 38,
        backWidth: parseFloat(document.getElementById('backWidth').value) || 14,
        chestWidth: parseFloat(document.getElementById('chestWidth').value) || 13,
        shoulderLength: parseFloat(document.getElementById('shoulderLength').value) || 5,
        backNeckToWaist: parseFloat(document.getElementById('backNeckToWaist').value) || 16,
        waistToHip: parseFloat(document.getElementById('waistToHip').value) || 8,
      };

      const data = calculateBodice(measurements);
      document.getElementById('svgContainer').innerHTML = renderSVG(data);
    }

    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', updatePattern);
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const svgElement = document.querySelector('#svgContainer svg');
      if (!svgElement) return;
      const blob = new Blob([svgElement.outerHTML], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bodice-pattern.svg';
      a.click();
      URL.revokeObjectURL(url);
    });

    window.addEventListener('DOMContentLoaded', updatePattern);
    updatePattern();
  </script>
</body>
</html>
