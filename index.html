<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Pattern Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f7f5f0;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            color: #2c2c2c;
        }
        .selector-group {
            margin-bottom: 15px;
        }
        .selector-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 1rem;
            background-color: #fff;
        }
        .workspace {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .workspace-controls button {
            padding: 6px 12px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        .svg-container {
            width: 100%;
            height: 700px;
            border: 1px solid #e0e0e0;
            background-image: 
                linear-gradient(to right, #f0f0f0 1px, transparent 1px),
                linear-gradient(to bottom, #f0f0f0 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: auto;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
            min-width: 1000px;
            min-height: 1000px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Pattern Modules</h2>
        
        <div class="selector-group">
            <label for="upperSelector">Upper Body Standard Size Selector (Bodice & Sleeve)</label>
            <select id="upperSelector">
                <option value="uk12">UK 12 / US 8 (Draft Spec)</option>
                <option value="uk10">UK 10 / US 6</option>
                <option value="uk14">UK 14 / US 10</option>
            </select>
        </div>

        <div class="selector-group">
            <label for="lowerSelector">Lower Body Standard Size Selector (Skirt & Trouser)</label>
            <select id="lowerSelector">
                <option value="uk12">UK 12 / US 8 (Draft Spec)</option>
                <option value="uk10">UK 10 / US 6</option>
                <option value="uk14">UK 14 / US 10</option>
            </select>
        </div>
    </div>

    <div class="workspace">
        <div class="workspace-header">
            <span>Grid Unit: 1 Inch</span>
            <div class="workspace-controls">
                <button>-</button>
                <button>1:1</button>
            </div>
        </div>
        <div class="svg-container">
            <svg id="patternCanvas" viewBox="0 0 1000 1000">
                <!-- All Pattern Groups Restored with Non-Overlapping Coordinates -->
                <g id="bodiceGroup" transform="translate(40, 40)">
                    <rect x="0" y="0" width="180" height="260" fill="#fcfcfc" stroke="#d9534f" stroke-dasharray="4" stroke-width="1.5"/>
                    <text x="10" y="25" font-size="12" fill="#333">Bodice Block (Chest: 13.0", Back: 14.0")</text>
                </g>

                <g id="sleeveGroup" transform="translate(240, 40)">
                    <rect x="0" y="0" width="200" height="320" fill="#fcfcfc" stroke="#d9534f" stroke-dasharray="4" stroke-width="1.5"/>
                    <text x="10" y="25" font-size="12" fill="#333">Fitted Sleeve (Top Arm: 11.5")</text>
                </g>

                <g id="skirtGroup" transform="translate(40, 390)">
                    <rect x="0" y="0" width="300" height="380" fill="#fcfcfc" stroke="#d9534f" stroke-dasharray="4" stroke-width="1.5"/>
                    <text x="10" y="25" font-size="12" fill="#333">Skirt: PENCIL (Hip: 37.0")</text>
                </g>
            </svg>
        </div>
    </div>
</div>

<script>
    function updateLayoutCoordinates() {
        const margin = 40; 
        const startX = 40;
        const startY = 40;

        const bodiceWidth = 180;
        const bodiceHeight = 260;
        
        const sleeveWidth = 200;
        const sleeveHeight = 320;

        const skirtWidth = 300;
        const skirtHeight = 380;

        // Position Upper Pieces
        const bodiceX = startX;
        const bodiceY = startY;

        const sleeveX = bodiceX + bodiceWidth + margin;
        const sleeveY = startY;

        // Position Lower Pieces safely below the maximum extent of upper elements to eliminate overlapping
        const maxUpperBottom = Math.max(bodiceY + bodiceHeight, sleeveY + sleeveHeight);
        const skirtX = startX;
        const skirtY = maxUpperBottom + margin;

        // Apply transformations
        document.getElementById('bodiceGroup').setAttribute('transform', `translate(${bodiceX}, ${bodiceY})`);
        document.getElementById('sleeveGroup').setAttribute('transform', `translate(${sleeveX}, ${sleeveY})`);
        document.getElementById('skirtGroup').setAttribute('transform', `translate(${skirtX}, ${skirtY})`);
    }

    document.getElementById('upperSelector').addEventListener('change', updateLayoutCoordinates);
    document.getElementById('lowerSelector').addEventListener('change', updateLayoutCoordinates);

    window.onload = updateLayoutCoordinates;
</script>

</body>
</html>
