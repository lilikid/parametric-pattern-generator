<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodice Pattern Generator - Technical Block</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; background: #f4f6f8; }
    h1 { margin-bottom: 20px; font-size: 20px; color: #1a1a1a; }
    .container { display: flex; gap: 20px; align-items: flex-start; }
    .controls { width: 340px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .controls h3 { margin-top: 0; margin-bottom: 12px; font-size: 14px; border-bottom: 2px solid #eee; padding-bottom: 6px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #444; }
    input[type="number"], select { width: 100%; padding: 7px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .checkbox-group label { margin-bottom: 0; cursor: pointer; }
    .checkbox-group input { width: auto; cursor: pointer; }
    .btn-container { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #0275d8; color: #fff; }
    .btn-primary:hover { background: #025aa5; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-secondary:hover { background: #5a6268; }
    .viewer { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: auto; min-height: 650px; display: flex; justify-content: center; }
  </style>
</head>
<body>

  <h1>Bodice Pattern Generator (Technical Woven Block)</h1>
  
  <div class="container">
    <div class="controls">
      <h3>Measurements (Inches)</h3>
      <div class="form-group">
        <label for="bust">Bust</label>
        <input type="number" id="bust" value="43" step="0.25">
      </div>
      <div class="form-group">
        <label for="waist">Waist</label>
        <input type="number" id="waist" value="23.5" step="0.25">
      </div>
      <div class="form-group">
        <label for="hip">Hip</label>
        <input type="number" id="hip" value="44" step="0.25">
      </div>
      <div class="form-group">
        <label for="backWidth">Across Back Width</label>
        <input type="number" id="backWidth" value="13.5" step="0.25">
      </div>
      <div class="form-group">
        <label for="chestWidth">Across Chest Width</label>
        <input type="number" id="chestWidth" value="14.25" step="0.25">
      </div>
      <div class="form-group">
        <label for="shoulderLength">Shoulder Length</label>
        <input type="number" id="shoulderLength" value="6.25" step="0.25">
      </div>
      <div class="form-group">
        <label for="backNeckToWaist">Back Neck to Waist</label>
        <input type="number" id="backNeckToWaist" value="18.5" step="0.25">
      </div>
      <div class="form-group">
        <label for="waistToHip">Waist to Hip</label>
        <input type="number" id="waistToHip" value="9.5" step="0.25">
      </div>

      <h3>Drafting Options</h3>
      <div class="form-group">
        <label for="easeProfile">Block Type &amp; Ease Allowance</label>
        <select id="easeProfile">
          <option value="corset">Corset / Foundation Block (Bust: 0", Waist: -1.0", Hip: 0")</option>
          <option value="close">Close-Fitting Bodice Block (Bust: +1.5", Waist: +1.0", Hip: +1.5")</option>
          <option value="standard" selected>Standard Bodice Block (Bust: +2.0", Waist: +1.5", Hip: +2.0")</option>
          <option value="loose">Loose-Fitting / Outerwear Block (Bust: +4.0", Waist: +2.5", Hip: +3.0")</option>
        </select>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="showGrid" checked>
        <label for="showGrid">Show Construction Grid &amp; Labels</label>
      </div>

      <div class="btn-container">
        <button class="btn-primary" id="generateBtn" type="button">Generate Pattern</button>
        <button class="btn-secondary" id="downloadBtn" type="button">Download SVG Pattern</button>
      </div>
    </div>

    <div class="viewer" id="svgContainer"></div>
  </div>

  <script>
    const EASE_PROFILES = {
      corset:   { bust: 0.0, waist: -1.0, hip: 0.0 },
      close:    { bust: 1.5, waist: 1.0, hip: 1.5 },
      standard: { bust: 2.0, waist: 1.5, hip: 2.0 },
      loose:    { bust: 4.0, waist: 2.5, hip: 3.0 }
    };

    function calculateBodice(m, profileKey, showGrid) {
      const ease = EASE_PROFILES[profileKey] || EASE_PROFILES.standard;

      const easeBust = m.bust + ease.bust;
      const easeWaist = m.waist + ease.waist;
      const easeHip = m.hip + ease.hip;

      const halfBackW = m.backWidth / 2;
      const halfChestW = m.chestWidth / 2;

      // Base block widths at bust line
      const backBustW = easeBust / 4 - 0.25;
      const frontBustW = easeBust / 4 + 0.25;

      // Base block widths at hip line
      const backHipW = easeHip / 4 - 0.25;
      const frontHipW = easeHip / 4 + 0.25;

      const blockGap = 3.0;
      const totalWidth = backBustW + frontBustW + blockGap;
      const totalHeight = m.backNeckToWaist + m.waistToHip;

      const topY = 1.0;
      const bustY = topY + m.backNeckToWaist * 0.5;
      const trueBustY = bustY + 1.25;
      const waistY = topY + m.backNeckToWaist;
      const hipY = topY + totalHeight;

      const neckW = (m.bust / 8 + 1.25) / 2;

      // Waist Intake Calculation
      const totalBustWidth = backBustW + frontBustW;
      const totalWaistWidthNeeded = easeWaist / 2;
      const totalWaistIntake = Math.max(0, totalBustWidth - totalWaistWidthNeeded);

      // Max side seam reduction capped to prevent overlapping curves
      const maxSideSeamIntake = totalWaistIntake * 0.4;
      const remainingIntake = totalWaistIntake - maxSideSeamIntake;

      const sideWaistIntakeEach = maxSideSeamIntake / 2;
      const b_waistDartW = remainingIntake * 0.45;
      const f_waistDartW = remainingIntake * 0.55;

      // --- BACK POINTS ---
      const b_np = { x: neckW, y: topY };
      const b_shoulderDrop = topY + 1.5;
      const b_sp = { x: neckW + m.shoulderLength + 0.5, y: b_shoulderDrop };

      const b_shDartInner = { x: neckW + (m.shoulderLength * 0.4), y: topY + 0.6 };
      const b_shDartOuter = { x: b_shDartInner.x + 0.5, y: topY + 0.75 };
      const b_shDartApex = { x: b_shDartInner.x + 0.1, y: topY + 3.0 };

      const b_waistDartX = backBustW * 0.45;
      const b_waistDartTop = { x: b_waistDartX, y: trueBustY };
      const b_waistDartBottom = { x: b_waistDartX, y: waistY + (m.waistToHip * 0.6) };

      // --- FRONT POINTS ---
      const f_cfX = totalWidth;
      const f_np = { x: f_cfX - neckW, y: topY };
      const f_sp = { x: f_cfX - neckW - m.shoulderLength - 1.5, y: b_shoulderDrop + 0.2 };

      const f_apex = { x: f_cfX - (m.bust / 10 + 0.5), y: trueBustY };

      const f_shDartInner = { x: f_cfX - neckW - 1.2, y: topY + 0.4 };
      const f_shDartOuter = { x: f_shDartInner.x - 1.2, y: topY + 0.8 };

      const f_waistDartTop = { x: f_apex.x, y: trueBustY + 0.75 };
      const f_waistDartBottom = { x: f_apex.x, y: waistY + (m.waistToHip * 0.55) };

      // Underarm Point (UP) & Side Seams
      const upX = backBustW + (blockGap / 2);
      const upY = bustY + 0.5;

      const sideWaistLeft = backBustW - sideWaistIntakeEach;
      const sideWaistRight = backBustW + blockGap + sideWaistIntakeEach;

      const backHipX = backHipW;
      const frontHipX = f_cfX - frontHipW;

      return {
        showGrid,
        totalW: totalWidth,
        totalH: hipY + 1.0,
        lines: { topY, bustY, trueBustY, waistY, hipY },
        cbX: 0,
        cfX: f_cfX,
        up: { x: upX, y: upY, leftW: sideWaistLeft, rightW: sideWaistRight, backBustW, frontBustX: backBustW + blockGap },
        hip: { backHipX, frontHipX },
        back: {
          np: b_np, sp: b_sp, halfBackW,
          shDartInner: b_shDartInner, shDartOuter: b_shDartOuter, shDartApex: b_shDartApex,
          waistDartX: b_waistDartX, waistDartW: b_waistDartW, waistDartTop: b_waistDartTop, waistDartBottom: b_waistDartBottom
        },
        front: {
          np: f_np, sp: f_sp, apex: f_apex, halfChestW,
          shDartInner: f_shDartInner, shDartOuter: f_shDartOuter,
          waistDartW: f_waistDartW, waistDartTop: f_waistDartTop, waistDartBottom: f_waistDartBottom
        }
      };
    }

    function renderSVG(d, scale = 20) {
      const pad = 40;
      const s = (val) => val * scale;
      const totalW = s(d.totalW) + pad * 2;
      const totalH = s(d.totalH) + pad * 2;

      const l = d.lines;
      const b = d.back;
      const f = d.front;

      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalW} ${totalH}" width="${totalW}" height="${totalH}">`;
      svg += `
        <style>
          .frame { stroke: #111; stroke-width: 2; fill: none; }
          .grid { stroke: #999; stroke-dasharray: 4,4; stroke-width: 1; }
          .guide-line { stroke: #bbb; stroke-dasharray: 2,2; stroke-width: 1; }
          .outline { stroke: #111; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
          .scye { stroke: #111; stroke-width: 2.2; fill: none; stroke-linecap: round; }
          .dart { stroke: #111; stroke-width: 1.8; fill: none; }
          .lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #333; font-weight: 500; }
          .title-lbl { font-family: system-ui, sans-serif; font-size: 12px; fill: #111; font-weight: bold; }
        </style>
      `;

      svg += `<g transform="translate(${pad}, ${pad})">`;

      // OUTER FRAME
      svg += `<rect class="frame" x="0" y="${s(l.topY)}" width="${s(d.totalW)}" height="${s(l.hipY - l.topY)}" />`;

      // REFERENCE GRID LINES
      if (d.showGrid) {
        svg += `<line class="grid" x1="0" y1="${s(l.bustY)}" x2="${s(d.totalW)}" y2="${s(l.bustY)}" />`;
        svg += `<line class="grid" x1="0" y1="${s(l.trueBustY)}" x2="${s(d.totalW)}" y2="${s(l.trueBustY)}" />`;
        svg += `<line class="grid" x1="0" y1="${s(l.waistY)}" x2="${s(d.totalW)}" y2="${s(l.waistY)}" />`;
        svg += `<line class="grid" x1="0" y1="${s(l.hipY)}" x2="${s(d.totalW)}" y2="${s(l.hipY)}" />`;

        svg += `<line class="guide-line" x1="${s(b.halfBackW)}" y1="${s(l.topY)}" x2="${s(b.halfBackW)}" y2="${s(l.bustY)}" />`;
        svg += `<line class="guide-line" x1="${s(d.totalW - f.halfChestW)}" y1="${s(l.topY)}" x2="${s(d.totalW - f.halfChestW)}" y2="${s(l.bustY)}" />`;

        svg += `<text class="title-lbl" x="${s(d.totalW / 2) - 30}" y="${s(l.topY) - 10}">Top Line</text>`;
        svg += `<text class="lbl" x="${s(d.totalW * 0.4)}" y="${s(l.bustY) - 4}">Bust Line</text>`;
        svg += `<text class="lbl" x="${s(d.totalW * 0.38)}" y="${s(l.trueBustY) - 4}">True Bust Line</text>`;
        svg += `<text class="lbl" x="${s(d.totalW * 0.4)}" y="${s(l.waistY) - 4}">Waist Line</text>`;
        svg += `<text class="lbl" x="${s(d.totalW * 0.4)}" y="${s(l.hipY) - 4}">Hip Line</text>`;

        svg += `<text class="title-lbl" x="-20" y="${s(l.topY) - 10}">CB</text>`;
        svg += `<text class="title-lbl" x="${s(d.totalW) + 5}" y="${s(l.topY) - 10}">CF</text>`;
        svg += `<text class="lbl" x="${s(b.np.x) - 8}" y="${s(l.topY) - 6}">NP</text>`;
        svg += `<text class="lbl" x="${s(b.sp.x) - 6}" y="${s(b.sp.y) - 8}">SP</text>`;
        svg += `<text class="lbl" x="${s(f.np.x) - 8}" y="${s(l.topY) - 6}">NP</text>`;
        svg += `<text class="lbl" x="${s(f.sp.x) - 14}" y="${s(f.sp.y) - 8}">SP</text>`;
        svg += `<text class="title-lbl" x="${s(d.up.x) - 8}" y="${s(d.up.y) - 8}">UP</text>`;
      }

      // BACK NECK & SHOULDER
      svg += `<path class="outline" d="M 0 ${s(l.topY + 0.6)} Q ${s(b.np.x * 0.4)} ${s(l.topY + 0.6)}, ${s(b.np.x)} ${s(b.np.y)}" />`;
      svg += `<line class="outline" x1="${s(b.np.x)}" y1="${s(b.np.y)}" x2="${s(b.shDartInner.x)}" y2="${s(b.shDartInner.y)}" />`;
      svg += `<line class="dart" x1="${s(b.shDartInner.x)}" y1="${s(b.shDartInner.y)}" x2="${s(b.shDartApex.x)}" y2="${s(b.shDartApex.y)}" />`;
      svg += `<line class="dart" x1="${s(b.shDartOuter.x)}" y1="${s(b.shDartOuter.y)}" x2="${s(b.shDartApex.x)}" y2="${s(b.shDartApex.y)}" />`;
      svg += `<line class="outline" x1="${s(b.shDartOuter.x)}" y1="${s(b.shDartOuter.y)}" x2="${s(b.sp.x)}" y2="${s(b.sp.y)}" />`;

      // FRONT NECK & SHOULDER
      svg += `<path class="outline" d="M ${s(d.totalW)} ${s(l.topY + 2.5)} Q ${s(d.totalW - f.np.x * 0.1)} ${s(l.topY + 2.5)}, ${s(f.np.x)} ${s(f.np.y)}" />`;
      svg += `<line class="outline" x1="${s(f.np.x)}" y1="${s(f.np.y)}" x2="${s(f.shDartInner.x)}" y2="${s(f.shDartInner.y)}" />`;
      svg += `<line class="dart" x1="${s(f.shDartInner.x)}" y1="${s(f.shDartInner.y)}" x2="${s(f.apex.x)}" y2="${s(f.apex.y)}" />`;
      svg += `<line class="dart" x1="${s(f.shDartOuter.x)}" y1="${s(f.shDartOuter.y)}" x2="${s(f.apex.x)}" y2="${s(f.apex.y)}" />`;
      svg += `<line class="outline" x1="${s(f.shDartOuter.x)}" y1="${s(f.shDartOuter.y)}" x2="${s(f.sp.x)}" y2="${s(f.sp.y)}" />`;

      // BUST APEX MARKER
      svg += `<text font-family="system-ui" font-size="14" font-weight="bold" x="${s(f.apex.x) + 6}" y="${s(f.apex.y) + 4}">x</text>`;

      // ARMHOLE SCYE CURVE
      svg += `<path class="scye" d="M ${s(b.sp.x)} ${s(b.sp.y)} C ${s(b.halfBackW)} ${s(l.bustY - 1)}, ${s(d.up.x - 1.2)} ${s(d.up.y)}, ${s(d.up.x)} ${s(d.up.y)} C ${s(d.up.x + 1.2)} ${s(d.up.y)}, ${s(d.totalW - f.halfChestW)} ${s(l.bustY - 1)}, ${s(f.sp.x)} ${s(f.sp.y)}" />`;

      // BACK SIDE SEAM (UP -> Back Waist -> Back Hip)
      svg += `<path class="outline" d="M ${s(d.up.x)} ${s(d.up.y)} Q ${s(d.up.backBustW)} ${s(l.bustY + 1)}, ${s(d.up.leftW)} ${s(l.waistY)} Q ${s(d.up.leftW + (d.hip.backHipX - d.up.leftW)*0.4)} ${s(l.waistY + (l.hipY - l.waistY)*0.5)}, ${s(d.hip.backHipX)} ${s(l.hipY)}" />`;

      // FRONT SIDE SEAM (UP -> Front Waist -> Front Hip)
      svg += `<path class="outline" d="M ${s(d.up.x)} ${s(d.up.y)} Q ${s(d.up.frontBustX)} ${s(l.bustY + 1)}, ${s(d.up.rightW)} ${s(l.waistY)} Q ${s(d.up.rightW - (d.up.rightW - d.hip.frontHipX)*0.4)} ${s(l.waistY + (l.hipY - l.waistY)*0.5)}, ${s(d.hip.frontHipX)} ${s(l.hipY)}" />`;

      // BACK WAIST DART
      const b_left = b.waistDartX - (b.waistDartW / 2);
      const b_right = b.waistDartX + (b.waistDartW / 2);
      svg += `<line class="dart" x1="${s(b_left)}" y1="${s(l.waistY)}" x2="${s(b.waistDartTop.x)}" y2="${s(b.waistDartTop.y)}" />`;
      svg += `<line class="dart" x1="${s(b_right)}" y1="${s(l.waistY)}" x2="${s(b.waistDartTop.x)}" y2="${s(b.waistDartTop.y)}" />`;
      svg += `<line class="dart" x1="${s(b_left)}" y1="${s(l.waistY)}" x2="${s(b.waistDartBottom.x)}" y2="${s(b.waistDartBottom.y)}" />`;
      svg += `<line class="dart" x1="${s(b_right)}" y1="${s(l.waistY)}" x2="${s(b.waistDartBottom.x)}" y2="${s(b.waistDartBottom.y)}" />`;

      // FRONT WAIST DART
      const f_left = f.apex.x - (f.waistDartW / 2);
      const f_right = f.apex.x + (f.waistDartW / 2);
      svg += `<line class="dart" x1="${s(f_left)}" y1="${s(l.waistY)}" x2="${s(f.waistDartTop.x)}" y2="${s(f.waistDartTop.y)}" />`;
      svg += `<line class="dart" x1="${s(f_right)}" y1="${s(l.waistY)}" x2="${s(f.waistDartTop.x)}" y2="${s(f.waistDartTop.y)}" />`;
      svg += `<line class="dart" x1="${s(f_left)}" y1="${s(l.waistY)}" x2="${s(f.waistDartBottom.x)}" y2="${s(f.waistDartBottom.y)}" />`;
      svg += `<line class="dart" x1="${s(f_right)}" y1="${s(l.waistY)}" x2="${s(f.waistDartBottom.x)}" y2="${s(f.waistDartBottom.y)}" />`;

      svg += `</g></svg>`;
      return svg;
    }

    function updatePattern() {
      const measurements = {
        bust: parseFloat(document.getElementById('bust').value) || 43,
        waist: parseFloat(document.getElementById('waist').value) || 23.5,
        hip: parseFloat(document.getElementById('hip').value) || 44,
        backWidth: parseFloat(document.getElementById('backWidth').value) || 13.5,
        chestWidth: parseFloat(document.getElementById('chestWidth').value) || 14.25,
        shoulderLength: parseFloat(document.getElementById('shoulderLength').value) || 6.25,
        backNeckToWaist: parseFloat(document.getElementById('backNeckToWaist').value) || 18.5,
        waistToHip: parseFloat(document.getElementById('waistToHip').value) || 9.5,
      };

      const profileKey = document.getElementById('easeProfile').value;
      const showGrid = document.getElementById('showGrid').checked;

      const data = calculateBodice(measurements, profileKey, showGrid);
      document.getElementById('svgContainer').innerHTML = renderSVG(data);
    }

    document.querySelectorAll('.controls input, .controls select').forEach(input => {
      input.addEventListener('input', updatePattern);
      input.addEventListener('change', updatePattern);
    });

    document.getElementById('generateBtn').addEventListener('click', updatePattern);

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const svgElement = document.querySelector('#svgContainer svg');
      if (!svgElement) return;
      const blob = new Blob([svgElement.outerHTML], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'technical-bodice-block.svg';
      a.click();
      URL.revokeObjectURL(url);
    });

    window.addEventListener('DOMContentLoaded', updatePattern);
    updatePattern();
  </script>
</body>
</html>
