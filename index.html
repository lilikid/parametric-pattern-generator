<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Bodice Pattern Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Panel */
        #sidebar { width: 320px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        h2 { font-size: 1.2rem; font-weight: 600; color: #0f172a; margin-bottom: 10px; }
        .section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 8px; }
        
        .input-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        label { font-size: 0.85rem; font-weight: 500; color: #334155; }
        input[type="number"], select { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
        
        .toggle-group { display: flex; flex-direction: column; gap: 8px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; }
        .checkbox-label input { cursor: pointer; }

        /* Main Canvas View */
        #main-view { flex: 1; display: flex; flex-direction: column; background: #f1f5f9; position: relative; }
        #toolbar { height: 50px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 500; cursor: pointer; font-size: 0.85rem; }
        .btn:hover { background: #1d4ed8; }

        #svg-container { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 20px; }
        svg { background: #ffffff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-radius: 4px; }
    </style>
</head>
<body>

    <!-- SIDEBAR CONTROLS -->
    <div id="sidebar">
        <div>
            <h2>Pattern Controls</h2>
            <div class="input-group">
                <label for="unit-select">Measurement Unit</label>
                <select id="unit-select">
                    <option value="inch" selected>Inches (in)</option>
                    <option value="cm">Centimeters (cm)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="ease-select">Silhouette Ease</label>
                <select id="ease-select">
                    <option value="1.0">Fitted (1.0")</option>
                    <option value="1.5">Semi-Fitted (1.5")</option>
                    <option value="2.0">Loose (2.0")</option>
                </select>
            </div>
        </div>

        <div>
            <div class="section-title">Measurements</div>
            <div class="input-group">
                <label for="m-bust">Bust Circumference</label>
                <input type="number" id="m-bust" value="36.0" step="0.25">
            </div>
            <div class="input-group">
                <label for="m-waist">Waist Circumference</label>
                <input type="number" id="m-waist" value="28.0" step="0.25">
            </div>
            <div class="input-group">
                <label for="m-hip">Hip Circumference</label>
                <input type="number" id="m-hip" value="38.0" step="0.25">
            </div>
            <div class="input-group">
                <label for="m-back-waist">Back Waist Length</label>
                <input type="number" id="m-back-waist" value="16.5" step="0.25">
            </div>
        </div>

        <div>
            <div class="section-title">Layer Visibility</div>
            <div class="toggle-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="toggle-grid" checked>
                    Background Grid
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="toggle-baselines" checked>
                    Reference Lines
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="toggle-darts" checked>
                    Sewing Darts
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="toggle-sa" checked>
                    Seam Allowance (0.5")
                </label>
            </div>
        </div>
    </div>

    <!-- MAIN SVG DISPLAY -->
    <div id="main-view">
        <div id="toolbar">
            <span style="font-weight: 600; font-size: 0.9rem;">2D Pattern Workspace</span>
            <button class="btn" id="btn-export-pdf">Export Multi-Page PDF</button>
        </div>
        <div id="svg-container">
            <svg id="pattern-svg" width="1200" height="850" viewBox="0 0 1200 850">
                <g id="layer-bg-grid"></g>
                <g id="layer-baselines"></g>
                <g id="layer-construction"></g>
                <g id="layer-sewing-darts"></g>
                <g id="layer-net-pattern"></g>
                <g id="layer-seam-allowance"></g>
                <g id="layer-markers"></g>
                <g id="layer-annotations"></g>
            </svg>
        </div>
    </div>

    <!-- ENGINE SCRIPTS -->
    <script src="measurements.js"></script>
    <script src="draftingEngine.js"></script>
    <script src="svgRenderer.js"></script>
    
    <script>
        // Main App Controller Wiring
        function updateApp() {
            const measurements = {
                B: parseFloat(document.getElementById('m-bust').value) || 36.0,
                W: parseFloat(document.getElementById('m-waist').value) || 28.0,
                H: parseFloat(document.getElementById('m-hip').value) || 38.0,
                BW: parseFloat(document.getElementById('m-back-waist').value) || 16.5,
            };

            const easeVal = parseFloat(document.getElementById('ease-select').value);
            const unitVal = document.getElementById('unit-select').value;

            const options = {
                unit: unitVal,
                showGrid: document.getElementById('toggle-grid').checked,
                showBaseLines: document.getElementById('toggle-baselines').checked,
                showSewingDarts: document.getElementById('toggle-darts').checked,
                showSA: document.getElementById('toggle-sa').checked
            };

            // Calculate geometry and render to SVG
            const patternData = DraftingEngine.calculatePattern(measurements, easeVal);
            SVGRenderer.render(patternData, options);
        }

        // Attach listeners to all UI inputs
        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('change', updateApp);
            element.addEventListener('input', updateApp);
        });

        // Initial render on load
        window.addEventListener('DOMContentLoaded', updateApp);
    </script>
</body>
</html>
