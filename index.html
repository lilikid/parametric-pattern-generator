                    </div>
                    <div id="skirtConfig">
                        <div class="garment-module-header" onclick="toggleModule('skirtBody')">
                            <h3>3. Skirt Window</h3>
                            <span style="font-size:0.75rem; font-weight:600; color:var(--primary);">Configure ▼</span>
                        </div>
                        <div id="skirtBody" class="garment-module-body" style="display:none;">
                            <div class="input-section">
                                <label for="skirtStyle">Skirt Silhouette Type</label>
                                <select id="skirtStyle">
                                    <option value="pencil" selected>Pencil Skirt (Fitted)</option>
                                    <option value="full">Full / A-Line Skirt (Flared)</option>
                                    <option value="semi">Semi-Circle Circular Skirt</option>
                                </select>
                            </div>
                            <div class="input-section">
                                <label>Waist & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="skirtWaist" value="26.0" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="skirtWaistEase" value="1.0" step="0.25"></div>
                                </div>
                            </div>
                            <div class="input-section">
                                <label>Hips & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="skirtHips" value="36.0" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="skirtHipsEase" value="1.75" step="0.25"></div>
                                </div>
                            </div>
                            <div class="input-section">
                                <label>Length (Waist to Hem) & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="skirtLength" value="38.5" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="skirtLengthEase" value="0.0" step="0.25"></div>
                                </div>
                            </div>
                            <div class="input-section">
                                <label>Waist to Knee & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="skirtWaistToKnee" value="23.0" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="skirtWaistToKneeEase" value="0.0" step="0.25"></div>
                                </div>
                            </div>
                            <div class="input-section">
                                <label>Hip Line Depth & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="skirtHipLine" value="8.75" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="skirtHipLineEase" value="0.0" step="0.25"></div>
                                </div>
                            </div>
                            <div class="input-section">
                                <label>Yoke Line Depth & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="skirtYokeLine" value="6.0" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="skirtYokeLineEase" value="0.0" step="0.25"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 4. PANTS WINDOW -->
                <div class="garment-module" style="margin-bottom:0;">
                    <div class="input-section" style="margin-bottom:10px;">
                        <label for="includePant">Enable Trouser Draft</label>
                        <select id="includePant" onchange="togglePieceConfig('pantConfig', this.value)">
                            <option value="yes" selected>Yes (Include Trousers)</option>
                            <option value="no">No (Exclude Trousers)</option>
                        </select>
                    </div>
                    <div id="pantConfig">
                        <div class="garment-module-header" onclick="toggleModule('pantsBody')">
                            <h3>4. Trousers / Pants Window</h3>
                            <span style="font-size:0.75rem; font-weight:600; color:var(--primary);">Configure ▼</span>
                        </div>
                        <div id="pantsBody" class="garment-module-body" style="display:none;">
                            <div class="input-section">
                                <label>Waist & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="pantWaist" value="26.0" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="pantWaistEase" value="1.0" step="0.25"></div>
                                </div>
                            </div>
                            <div class="input-section">
                                <label>Hips & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="pantHips" value="36.0" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="pantHipsEase" value="2.0" step="0.25"></div>
                                </div>
                            </div>
                            <div class="input-section">
                                <label>Body Rise Depth & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="pantRise" value="11.5" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="pantRiseEase" value="0.5" step="0.25"></div>
                                </div>
                            </div>
                            <div class="input-section">
                                <label>Thigh Circumference & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="thigh" value="23.0" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="thighEase" value="2.75" step="0.25"></div>
                                </div>
                            </div>
                            <div class="input-section">
                                <label>Knee Circumference & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="kneeCirc" value="13.5" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="kneeCircEase" value="1.0" step="0.25"></div>
                                </div>
                            </div>
                            <div class="input-section">
                                <label>Inseam / Total Pant Length & Ease</label>
                                <div class="dual-input">
                                    <input type="number" id="inseam" value="30.0" step="0.25">
                                    <div class="input-with-label"><span class="input-label-tag">Ease</span><input type="number" id="inseamEase" value="0.0" step="0.25"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn-container">
                <button type="button" class="action-btn btn-primary" onclick="generatePattern()">Generate All Selected Patterns</button>
                <button type="button" class="action-btn btn-secondary" onclick="downloadSVG()">Download Combined SVG</button>
            </div>
        </div>

        <!-- Preview Canvas -->
        <div class="preview-container">
            <div class="preview-toolbar">
                <span id="current-unit-label" style="font-size: 0.85rem; font-weight:600; color:#4a3f3d;">Grid Unit: 1 Inch</span>
                <div class="zoom-controls">
                    <button class="zoom-btn" onclick="adjustZoom(-0.15)" title="Zoom Out">-</button>
                    <button class="zoom-btn" onclick="resetZoom()" style="width: 48px; font-size: 0.78rem;" title="Reset Zoom">1:1</button>
                    <button class="zoom-btn" onclick="adjustZoom(0.15)" title="Zoom In">+</button>
                </div>
            </div>
            
            <div id="svg-scroll-viewport">
                <div id="svg-canvas-wrapper">
                    <svg id="pattern-svg" width="1600" height="1400" viewBox="0 0 1600 1400" xmlns="http://www.w3.org/2000/svg">
                        <rect width="100%" height="100%" fill="#ffffff" />
                        <g id="grid-group"></g>
                        <g id="pattern-group">
                            <text x="800" y="700" text-anchor="middle" fill="#8c7e7b" font-family="Montserrat" font-size="14">Atelier Drafting Table Ready — Click "Generate All Selected Patterns"</text>
                        </g>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUnit = 'in';
        let currentScale = 1.0;
        let panX = 50;
        let panY = 50;
        let isDragging = false;
        let startMouseX = 0;
        let startMouseY = 0;
        const scaleFactor = 26;

        function initGrid() {
            const gridGroup = document.getElementById('grid-group');
            gridGroup.innerHTML = '';
            const width = 1600, height = 1400;

            // Unit base step (1 inch or 1 cm)
            const baseStep = currentUnit === 'in' ? scaleFactor : scaleFactor / 2.54;
            // Subdivisions: 0.5 unit intervals for half-unit clarity
            const subStep = baseStep / 2;

            // Draw vertical grid lines
            for (let x = 0; x <= width; x += subStep) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x); line.setAttribute('y1', 0);
                line.setAttribute('x2', x); line.setAttribute('y2', height);

                const ratio = x / baseStep;
                const isMajor = Math.abs(ratio - Math.round(ratio)) < 0.001 && Math.round(ratio) % (currentUnit === 'in' ? 4 : 5) === 0;
                const isHalf = Math.abs(ratio - Math.round(ratio)) < 0.001;

                if (isMajor) {
                    line.setAttribute('class', 'grid-line-major');
                } else if (isHalf) {
                    line.setAttribute('class', 'grid-line-half');
                } else {
                    line.setAttribute('class', 'grid-line-sub');
                }
                gridGroup.appendChild(line);
            }

            // Draw horizontal grid lines
            for (let y = 0; y <= height; y += subStep) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', 0); line.setAttribute('y1', y);
                line.setAttribute('x2', width); line.setAttribute('y2', y);

                const ratio = y / baseStep;
                const isMajor = Math.abs(ratio - Math.round(ratio)) < 0.001 && Math.round(ratio) % (currentUnit === 'in' ? 4 : 5) === 0;
                const isHalf = Math.abs(ratio - Math.round(ratio)) < 0.001;

                if (isMajor) {
                    line.setAttribute('class', 'grid-line-major');
                } else if (isHalf) {
                    line.setAttribute('class', 'grid-line-half');
                } else {
                    line.setAttribute('class', 'grid-line-sub');
                }
                gridGroup.appendChild(line);
            }
        }

        function setUnit(unit) {
            currentUnit = unit;
            document.getElementById('unit-in').classList.toggle('active', unit === 'in');
            document.getElementById('unit-cm').classList.toggle('active', unit === 'cm');
            document.getElementById('current-unit-label').innerText = unit === 'in' ? 'Grid Unit: 1 Inch (0.5" Subdivisions)' : 'Grid Unit: 1 Centimeter (0.5cm Subdivisions)';
            initGrid();
        }

        function toggleModule(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'none') ? 'block' : 'none';
        }

        function togglePieceConfig(containerId, val) {
            const container = document.getElementById(containerId);
            container.style.display = (val === 'yes') ? 'block' : 'none';
        }

        function applyUpperStandardSize() {
            const size = document.getElementById('upperStandardSize').value;
            if (!size) return;

            const sizes = {
                'uk8':  { bust: 32.0, waist: 24.0, hip: 34.0, chest: 12.5, back: 13.5, shoulder: 4.875, bstToWst: 15.0, bicep: 10.5, sleeveLen: 22.5, elw: 12.0, wrist: 6.0 },
                'uk10': { bust: 33.25, waist: 24.75, hip: 35.5, chest: 12.75, back: 13.75, shoulder: 4.875, bstToWst: 15.25, bicep: 11.0, sleeveLen: 22.75, elw: 12.25, wrist: 6.125 },
                'uk12': { bust: 34.5, waist: 25.5, hip: 37.0, chest: 13.0, back: 14.0, shoulder: 5.0, bstToWst: 15.5, bicep: 11.5, sleeveLen: 23.0, elw: 12.5, wrist: 6.25 },
                'uk14': { bust: 37.5, waist: 28.5, hip: 39.5, chest: 13.75, back: 14.75, shoulder: 5.25, bstToWst: 16.0, bicep: 12.25, sleeveLen: 23.5, elw: 13.0, wrist: 6.5 },
                'uk16': { bust: 39.5, waist: 30.5, hip: 41.5, chest: 14.25, back: 15.25, shoulder: 5.375, bstToWst: 16.25, bicep: 13.0, sleeveLen: 24.0, elw: 13.5, wrist: 6.75 }
            };

            const data = sizes[size];
            if (data) {
                document.getElementById('bust').value = data.bust;
                document.getElementById('waist').value = data.waist;
                document.getElementById('hip').value = data.hip;
                document.getElementById('chestWidth').value = data.chest;
                document.getElementById('backWidth').value = data.back;
                document.getElementById('shoulderLength').value = data.shoulder;
                document.getElementById('backNeckToWaist').value = data.bstToWst;
                document.getElementById('bicep').value = data.bicep;
                document.getElementById('sleeveLength').value = data.sleeveLen;
                document.getElementById('shoulderToElbow').value = data.elw;
                document.getElementById('wristCirc').value = data.wrist;

                document.getElementById('chestWidthEase').value = 0;
                document.getElementById('backWidthEase').value = 0;
                document.getElementById('shoulderLengthEase').value = 0;
                document.getElementById('backNeckToWaistEase').value = 0;
                document.getElementById('sleeveLengthEase').value = 0;
                document.getElementById('shoulderToElbowEase').value = 0;
                document.getElementById('wristCircEase').value = 0;
            }
        }

        function applyLowerStandardSize() {
            const size = document.getElementById('lowerStandardSize').value;
            if (!size) return;

            const sizes = {
                'uk8':  { waist: 24.0, hips: 35.0, skirtLen: 37.0, kneeToWst: 22.0, hipLine: 8.25, yoke: 5.5, rise: 10.75, thigh: 21.5, knee: 12.5, inseam: 29.0 },
                'uk10': { waist: 24.75, hips: 36.0, skirtLen: 37.5, kneeToWst: 22.5, hipLine: 8.5, yoke: 5.75, rise: 11.0, thigh: 22.25, knee: 13.0, inseam: 29.5 },
                'uk12': { waist: 26.0, hips: 36.0, skirtLen: 38.5, kneeToWst: 23.0, hipLine: 8.75, yoke: 6.0, rise: 11.5, thigh: 23.0, knee: 13.5, inseam: 30.0 },
                'uk14': { waist: 28.5, hips: 40.0, skirtLen: 39.0, kneeToWst: 23.5, hipLine: 9.0, yoke: 6.25, rise: 12.0, thigh: 24.5, knee: 14.25, inseam: 30.5 },
                'uk16': { waist: 30.5, hips: 42.0, skirtLen: 39.5, kneeToWst: 24.0, hipLine: 9.25, yoke: 6.5, rise: 12.5, thigh: 26.0, knee: 15.0, inseam: 31.0 }
            };

            const data = sizes[size];
            if (data) {
                document.getElementById('skirtWaist').value = data.waist;
                document.getElementById('skirtHips').value = data.hips;
                document.getElementById('skirtLength').value = data.skirtLen;
                document.getElementById('skirtWaistToKnee').value = data.kneeToWst;
                document.getElementById('skirtHipLine').value = data.hipLine;
                document.getElementById('skirtYokeLine').value = data.yoke;

                document.getElementById('pantWaist').value = data.waist;
                document.getElementById('pantHips').value = data.hips;
                document.getElementById('pantRise').value = data.rise;
                document.getElementById('thigh').value = data.thigh;
                document.getElementById('kneeCirc').value = data.knee;
                document.getElementById('inseam').value = data.inseam;
            }
        }

        function applyPreset() {
            const preset = document.getElementById('blockPreset').value;
            const bEase = document.getElementById('bustEase');
            const wEase = document.getElementById('waistEase');
            const hEase = document.getElementById('hipEase');

            if (preset === 'standard') { bEase.value = 2.0; wEase.value = 1.5; hEase.value = 2.0; }
            else if (preset === 'fitted') { bEase.value = 1.0; wEase.value = 0.5; hEase.value = 1.0; }
            else if (preset === 'loose') { bEase.value = 3.0; wEase.value = 2.5; hEase.value = 3.0; }
        }

        function generatePattern() {
            const patternGroup = document.getElementById('pattern-group');
            patternGroup.innerHTML = '';

            const pieces = [];

            const bustVal = parseFloat(document.getElementById('bust').value) + parseFloat(document.getElementById('bustEase').value);
            const backLengthVal = parseFloat(document.getElementById('backNeckToWaist').value) + parseFloat(document.getElementById('backNeckToWaistEase').value);
            pieces.push({
                name: `Bodice Block (Bust: ${document.getElementById('bust').value}" + ${document.getElementById('bustEase').value}" ease)`,
                width: (bustVal / 4) * scaleFactor,
                height: backLengthVal * scaleFactor,
                stroke: '#c25e6f',
                fill: 'rgba(194, 94, 111, 0.06)'
            });

            if (document.getElementById('includeSleeve').value === 'yes') {
                const sLenVal = (parseFloat(document.getElementById('sleeveLength').value) + parseFloat(document.getElementById('sleeveLengthEase').value)) * scaleFactor;
                const bicepVal = (parseFloat(document.getElementById('bicep').value) + parseFloat(document.getElementById('bicepEase').value)) * scaleFactor;
                pieces.push({
                    name: `Fitted Sleeve (Bicep: ${document.getElementById('bicep').value}" + ${document.getElementById('bicepEase').value}" ease)`,
                    width: bicepVal,
                    height: sLenVal,
                    stroke: '#5c524f',
                    fill: 'rgba(92, 82, 79, 0.05)'
                });
            }

            if (document.getElementById('includeSkirt').value === 'yes') {
                const skirtHips = parseFloat(document.getElementById('skirtHips').value) + parseFloat(document.getElementById('skirtHipsEase').value);
                const skirtLen = parseFloat(document.getElementById('skirtLength').value) + parseFloat(document.getElementById('skirtLengthEase').value);
                pieces.push({
                    name: `Skirt: ${document.getElementById('skirtStyle').value.toUpperCase()} (Hips: ${document.getElementById('skirtHips').value}")`,
                    width: (skirtHips / 4) * scaleFactor,
                    height: skirtLen * scaleFactor,
                    stroke: '#c25e6f',
                    fill: 'rgba(194, 94, 111, 0.04)'
                });
            }

            if (document.getElementById('includePant').value === 'yes') {
                const thighVal = parseFloat(document.getElementById('thigh').value) + parseFloat(document.getElementById('thighEase').value);
                const inseamVal = parseFloat(document.getElementById('inseam').value) + parseFloat(document.getElementById('inseamEase').value);
                pieces.push({
                    name: `Trouser Block (Rise: ${document.getElementById('pantRise').value}")`,
                    width: (thighVal / 2) * scaleFactor,
                    height: inseamVal * scaleFactor,
                    stroke: '#5c524f',
                    fill: 'rgba(92, 82, 79, 0.04)'
                });
            }

            const originX = 50;
            const originY = 50;
            const gapX = 60;
            const gapY = 60;
            const maxPerRow = 2;

            let currentX = originX;
            let currentY = originY;
            let rowMaxHeight = 0;
            let colIndex = 0;

            pieces.forEach((piece) => {
                if (colIndex >= maxPerRow) {
                    currentX = originX;
                    currentY += rowMaxHeight + gapY;
                    rowMaxHeight = 0;
                    colIndex = 0;
                }

                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', currentX);
                rect.setAttribute('y', currentY);
                rect.setAttribute('width', piece.width);
                rect.setAttribute('height', piece.height);
                rect.setAttribute('fill', piece.fill);
                rect.setAttribute('stroke', piece.stroke);
                rect.setAttribute('stroke-width', '2');
                rect.setAttribute('stroke-dasharray', '4');
                patternGroup.appendChild(rect);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', currentX + 15);
                text.setAttribute('y', currentY + 25);
                text.setAttribute('fill', '#2c2524');
                text.setAttribute('font-family', 'Montserrat');
                text.setAttribute('font-size', '12');
                text.setAttribute('font-weight', '600');
                text.textContent = piece.name;
                patternGroup.appendChild(text);

                if (piece.height > rowMaxHeight) {
                    rowMaxHeight = piece.height;
                }

                currentX += piece.width + gapX;
                colIndex++;
            });
        }

        function updateTransform() {
            const wrapper = document.getElementById('svg-canvas-wrapper');
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
        }

        function adjustZoom(amount) {
            currentScale = Math.max(0.3, Math.min(3.0, currentScale + amount));
            updateTransform();
        }

        function resetZoom() {
            currentScale = 1.0;
            panX = 50;
            panY = 50;
            updateTransform();
        }

        function downloadSVG() {
            const svgEl = document.getElementById('pattern-svg');
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svgEl);
            if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            const blob = new Blob([source], {type: "image/svg+xml;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Lilinora_Atelier_Pattern.svg";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        const viewport = document.getElementById('svg-scroll-viewport');

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startMouseX = e.clientX - panX;
            startMouseY = e.clientY - panY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startMouseX;
            panY = e.clientY - startMouseY;
            updateTransform();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const zoomIntensity = 0.1;
            const oldScale = currentScale;
            
            if (e.deltaY < 0) {
                currentScale = Math.min(3.0, currentScale + zoomIntensity);
            } else {
                currentScale = Math.max(0.3, currentScale - zoomIntensity);
            }

            panX = mouseX - (mouseX - panX) * (currentScale / oldScale);
            panY = mouseY - (mouseY - panY) * (currentScale / oldScale);

            updateTransform();
        }, { passive: false });

        window.onload = () => {
            initGrid();
            updateTransform();
        };
    </script>
</body>
