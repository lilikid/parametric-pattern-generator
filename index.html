<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Pattern Generator</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        header {
            grid-column: 1 / -1;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.75rem;
            margin: 0 0 0.5rem 0;
        }

        p.subtitle {
            color: #64748b;
            margin: 0;
        }

        .panel {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            height: fit-content;
        }

        .control-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .viewer-panel {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            overflow: hidden;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            min-height: 450px;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            background-color: #ffffff;
        }

        .actions {
            margin-top: 1.5rem;
            grid-column: 1 / -1;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Styling for the Back Neck Point label */
        .neck-point-label {
            font-size: 11px;
            font-weight: bold;
            fill: #2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Parametric Pattern Generator</h1>
        <p class="subtitle">Dynamic 2D garment drafting workspace</p>
    </header>

    <!-- Controls Panel -->
    <div class="panel">
        <h3>Measurements (cm)</h3>
        <div class="control-group">
            <label for="bust">Bust Circumference</label>
            <input type="number" id="bust" value="92" step="0.5" oninput="updatePattern()">
        </div>
        <div class="control-group">
            <label for="waist">Waist Circumference</label>
            <input type="number" id="waist" value="74" step="0.5" oninput="updatePattern()">
        </div>
        <div class="control-group">
            <label for="backLength">Back Waist Length</label>
            <input type="number" id="backLength" value="40" step="0.5" oninput="updatePattern()">
        </div>
        <div class="control-group">
            <label for="shoulder">Shoulder Width</label>
            <input type="number" id="shoulder" value="13" step="0.5" oninput="updatePattern()">
        </div>
    </div>

    <!-- SVG Viewing Panel -->
    <div class="viewer-panel">
        <svg id="patternSvg" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
            <!-- Grid lines for reference -->
            <defs>
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
            
            <!-- Dynamic Pattern Paths will be injected here -->
            <g id="patternGroup" transform="translate(100, 50)">
                <!-- Bodice Block Outline -->
                <path id="bodicePath" d="" fill="none" stroke="#2563eb" stroke-width="2" />
                <!-- Construction Guidelines -->
                <path id="guidelinesPath" d="" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
                <!-- Back Neck Point Marker & Label -->
                <circle id="neckPointDot" cx="0" cy="0" r="3.5" fill="#2563eb" />
                <text id="neckPointText" class="neck-point-label" x="0" y="0">Back Neck Point</text>
            </g>
        </svg>
    </div>
</div>

<script>
    function updatePattern() {
        // Read input values
        const bust = parseFloat(document.getElementById('bust').value);
        const waist = parseFloat(document.getElementById('waist').value);
        const backLength = parseFloat(document.getElementById('backLength').value);
        const shoulder = parseFloat(document.getElementById('shoulder').value);

        // Scaling factor for screen display (pixels per cm)
        const scale = 3.5; 

        // Derived drafting calculations
        const quarterBust = (bust / 4) * scale;
        const quarterWaist = (waist / 4) * scale;
        const length = backLength * scale;
        const schWidth = shoulder * scale;
        const armholeDepth = (bust / 6 + 7) * scale;

        // Step 4 Calculations: Back Neck Width = (Bust / 8) + 3cm (approx 1 1/4")
        const backNeckWidth = ((bust / 8) + 3) * scale;
        // Square up 2cm (approx 3/4") from the Nape line
        const backNeckRise = 2 * scale; 

        // Starting origin base coordinates for block
        const originX = 50;
        const originY = 20;

        // Coordinates for Back Neck Point based on Step 4
        const neckPointX = originX + backNeckWidth;
        const neckPointY = originY - backNeckRise; // Squared up

        // Constructing SVG Path for a parametric bodice block component integrating Step 4 neck point
        const dMain = `
            M ${originX},${originY} 
            Q ${originX + backNeckWidth * 0.5},${neckPointY - 4} ${neckPointX},${neckPointY}
            L ${originX + schWidth},${originY + 5} 
            Q ${originX + quarterBust * 0.8},${originY + armholeDepth * 0.5} ${originX + quarterBust},${originY + armholeDepth} 
            L ${originX + quarterWaist},${originY + length} 
            L ${originX},${originY + length} 
            Z
        `;

        // Construction guide lines including neck width and square-up guides
        const dGuides = `
            M ${originX},${originY} L ${originX},${originY + length}
            M ${originX},${originY} L ${neckPointX},${originY}
            M ${neckPointX},${originY} L ${neckPointX},${neckPointY}
            M ${originX},${originY + armholeDepth} L ${originX + quarterBust},${originY + armholeDepth}
        `;

        // Update main shapes and guidelines
        document.getElementById('bodicePath').setAttribute('d', dMain.trim());
        document.getElementById('guidelinesPath').setAttribute('d', dGuides.trim());

        // Update Back Neck Point circle and label positions dynamically
        const dot = document.getElementById('neckPointDot');
        const text = document.getElementById('neckPointText');
        
        dot.setAttribute('cx', neckPointX);
        dot.setAttribute('cy', neckPointY);
        
        text.setAttribute('x', neckPointX + 6);
        text.setAttribute('y', neckPointY + 3);
    }

    // Initial render on load
    window.onload = updatePattern;
</script>

</body>
</html>
