<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilinora | Precision Atelier Pattern Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Optional: extract CSS if needed -->
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="brand-logo-symbol">
                <!-- Logo SVG -->
            </div>
            <div class="brand-titles">
                <h1>Lilinora</h1>
                <p>Precision Atelier Pattern Generator</p>
            </div>
        </div>
        <div class="unit-selector">
            <button class="unit-btn active" id="unit-in" onclick="setUnit('in')">Inches (in)</button>
            <button class="unit-btn" id="unit-cm" onclick="setUnit('cm')">Centimeters (cm)</button>
        </div>
    </header>

    <div class="workspace">
        <!-- Control Panel Outline -->
        <div class="control-panel" id="control-panel-root">
            <!-- Dynamic Modules loaded via JS -->
        </div>

        <!-- Preview Canvas Outline -->
        <div class="preview-container">
            <div class="preview-toolbar">
                <span id="current-unit-label">Grid Unit: 1 Inch</span>
                <div class="zoom-controls">
                    <button class="zoom-btn" onclick="adjustZoom(-0.15)">-</button>
                    <button class="zoom-btn" onclick="resetZoom()">1:1</button>
                    <button class="zoom-btn" onclick="adjustZoom(0.15)">+</button>
                </div>
            </div>
            
            <div id="svg-scroll-viewport">
                <div id="svg-canvas-wrapper">
                    <svg id="pattern-svg" width="1600" height="1400" viewBox="0 0 1600 1400" xmlns="http://www.w3.org/2000/svg">
                        <rect width="100%" height="100%" fill="#ffffff" />
                        <g id="grid-group"></g>
                        <g id="pattern-group"></g>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Modular Script Imports -->
    <script src="measurements.js"></script>
    <script src="draftingEngine.js"></script>
    <script src="svgRenderer.js"></script>
    <script src="app.js"></script>
</body>
</html>
